<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFB — Info Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ============================================================
   Charte Pilotage achats : rail de navigation blanc a gauche,
   tuiles d'indicateurs, tableau dense. Bleu nuit pour l'action
   et les barres, ambre pour ce qui appelle une intervention.
   ============================================================ */
:root{
  --bg:#f6f5f1; --sur:#fff; --sur2:#f1efe9; --sur3:#faf9f6;
  --bor:#e4e1d9; --bor2:#d5d1c7;
  --tx:#201f1c; --tx2:#6b6760; --tx3:#9b978e;
  --nav:#1b3a53; --navh:#14293b; --navbg:#eef1f4;
  --amb:#d9601a; --ambbg:#fdf6ed; --ambbor:#f0dcc2;
  --ok:#16a34a; --red:#dc2626;
  /* Echelle typographique : cinq tailles, trois graisses. Aucune valeur
     de font-size n'est ecrite ailleurs que par ces jetons. */
  --t0:10.5px;  /* etiquettes capitales, meta */
  --t1:12.5px;  /* secondaire : sous-titres, pastilles, legendes */
  --t2:13.5px;  /* courant : cellules, champs, navigation */
  --t3:15px;    /* titre de section, valeur de champ en fiche */
  --t4:17px;    /* titre de panneau et de fiche */
  --r:8px; --rs:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:var(--t2);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
table{border-collapse:collapse;width:100%}

/* ---------- rail ---------- */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.rail{background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;
  gap:4px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
.rtop{padding:0 6px 15px;border-bottom:1px solid var(--bor);margin-bottom:11px}
.brand{height:24px;width:auto;display:block}
/* Le logo ouvre une photo plein ecran. Rien ne l'annonce : pas de curseur
   main, pas d'info-bulle, pas de bordure au survol. */
.scr{position:fixed;inset:0;z-index:300;background:#000;display:none;
  align-items:center;justify-content:center}
.scr.on{display:flex}
.scr img{width:100%;height:100%;object-fit:contain;display:block}
.rlb{font-size:var(--t0);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);
  padding:0 8px;margin-bottom:7px}
.rnav{display:flex;flex-direction:column;gap:1px}
.rnav a{font-size:var(--t2);font-weight:500;padding:8px 11px;border-radius:var(--rs);color:var(--tx2);
  text-decoration:none;cursor:pointer}
.rnav a.on{background:var(--navbg);color:var(--nav);font-weight:600}
.rnav a.off{color:var(--tx3);font-style:italic;cursor:default}
.rsp{flex:1 1 auto;min-height:14px}
.rbot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--bor)}
.etat{display:flex;align-items:flex-start;gap:7px;font-size:var(--t1);color:var(--tx2);line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none;margin-top:4px}
.dot.ok{background:var(--ok)}.dot.err{background:var(--red)}.dot.warn{background:var(--amb)}
.dot.spin{background:var(--amb);animation:puls 1.1s infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.25}}
.sm{color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;
  border-radius:var(--rs);border:1px solid var(--bor2);background:var(--sur);cursor:pointer;
  font-size:var(--t2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sur2)}
.btn:focus-visible{outline:2px solid var(--nav);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:var(--sur)}
.btn-nav{background:var(--nav);border-color:var(--nav);color:#fff}
.btn-nav:hover{background:var(--navh)}

/* ---------- barre d'outils ---------- */
.main{padding:18px 20px 60px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw{position:relative;flex:0 1 300px;min-width:200px}
.sw i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px}
#q{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bor2);border-radius:var(--rs);
  background:var(--sur);font-size:var(--t2)}
#q:focus{outline:none;border-color:var(--nav);box-shadow:0 0 0 3px rgba(27,58,83,.1)}

/* ---------- panneau et tableau ---------- */
.panel{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden}
.ph{display:flex;align-items:baseline;gap:10px;padding:13px 16px;border-bottom:1px solid var(--bor)}
.pt{font-size:var(--t3);font-weight:600;letter-spacing:-.15px}
.cnt{font-size:var(--t1);color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.fin{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.ex{padding:6px 11px;font-size:var(--t1);gap:6px;white-space:nowrap}
.ex i{font-size:15px}

/* choix des colonnes avant extraction */
#ov-x{z-index:40}
.dlg{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-48%) scale(.99);
  width:min(620px,calc(100vw - 32px));max-height:min(78vh,760px);display:none;flex-direction:column;
  background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);
  box-shadow:0 18px 50px rgba(20,30,40,.22)}
.dlg.on{display:flex;animation:dlgin .14s ease-out forwards}
@keyframes dlgin{to{transform:translate(-50%,-50%) scale(1)}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bor)}
.dh b{font-size:var(--t3);font-weight:650}
.dh .ic{margin-left:auto}
.db{padding:14px 16px;overflow:auto;flex:1}
.df{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bor);
  background:var(--sur3);border-radius:0 0 var(--r) var(--r)}
.df .cnt{margin-right:auto}
.xg{margin-bottom:15px}
.xg:last-child{margin-bottom:0}
.xgt{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.xgt b{font-size:var(--t0);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.xl{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:3px 12px}
.xc{display:flex;align-items:center;gap:7px;font-size:var(--t1);padding:3px 0;cursor:pointer;min-width:0}
.xc input{flex:none;accent-color:var(--nav);width:14px;height:14px;cursor:pointer}
.xc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xc:hover span{color:var(--amb)}

/* couleurs d'impression relevees dans les BAT */
.pant{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.pa{font-size:var(--t1);font-weight:600;padding:3px 10px;border-radius:999px;
  background:var(--sur2);border:1px solid var(--bor);color:var(--tx);white-space:nowrap}
.tw{overflow-x:auto}
th{text-align:left;padding:8px 14px;font-size:var(--t0);font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--tx3);border-bottom:1px solid var(--bor);white-space:nowrap;
  user-select:none}
thead tr.hd th{cursor:pointer}
thead tr.hd th:hover{color:var(--tx2)}
th .si{margin-left:4px;font-size:9px;opacity:.45}
th.asc .si::after{content:'↑';opacity:1;color:var(--nav)}
th.desc .si::after{content:'↓';opacity:1;color:var(--nav)}
th .si::after{content:'↕'}
th.num,td.num{text-align:right}
thead tr.tot th{background:var(--sur2);color:var(--tx);font-size:var(--t1);font-weight:700;
  text-transform:none;letter-spacing:0;cursor:default;border-bottom:1px solid var(--bor2);padding:7px 14px}
thead tr.tot th.lb{font-weight:600;color:var(--tx2)}
td{padding:9px 14px;border-bottom:1px solid var(--bor);font-size:var(--t2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sur3)}
tbody tr.sel td{background:var(--navbg)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--nav)}
tbody tr:last-child td{border-bottom:none}
.ref{font-weight:600;letter-spacing:-.1px}
.tm{color:var(--tx2)}
.mono{font-variant-numeric:tabular-nums}
.docs{display:flex;gap:3px}
.doc{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:11px;
  background:var(--sur2);color:var(--tx3);border:1px solid var(--bor)}
.doc.on{background:var(--navbg);color:var(--nav);border-color:#d6dee6}
.pil{display:inline-block;padding:2px 9px;border-radius:999px;font-size:var(--t1);font-weight:500;
  border:1px solid transparent;white-space:nowrap}
.p-a{background:#e9f5ec;color:#15683a;border-color:#c6e6d2}
.p-i{background:var(--sur2);color:var(--tx2);border-color:var(--bor2)}
.p-p{background:var(--ambbg);color:#9a4a12;border-color:var(--ambbor)}
.pil.man{box-shadow:inset 0 0 0 1px currentColor}
.sep{width:1px;height:17px;background:var(--bor2);flex:none;margin:0 3px}
.chip.s-a.on{background:#15683a;border-color:#15683a}
.chip.s-i.on{background:var(--tx2);border-color:var(--tx2)}
.chip.s-p.on{background:var(--amb);border-color:var(--amb)}
.vide{padding:44px 16px;text-align:center;color:var(--tx3)}
.couv{display:inline-block;padding:1px 8px;border-radius:999px;font-size:var(--t1);font-weight:600;
  font-variant-numeric:tabular-nums}
.couv.bas{background:#fdeaea;color:#b42318}
.couv.moy{background:var(--ambbg);color:#9a4a12}
.couv.ok{background:#e9f5ec;color:#15683a}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.chip{border:1px solid var(--bor2);background:var(--sur);border-radius:999px;padding:6px 12px;
  font-size:var(--t1);color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:hover{background:var(--sur2)}
.chip.on{background:var(--nav);border-color:var(--nav);color:#fff;font-weight:500}
.chip .nb{font-variant-numeric:tabular-nums;font-size:var(--t0);opacity:.7;margin-left:2px}

td.vd,.vd{color:var(--tx3)}

/* ---------- fiche ---------- */
.ov{position:fixed;inset:0;background:rgba(20,25,32,.34);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:60}
.ov.on{opacity:1;pointer-events:auto}
.fiche{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);
  border-left:1px solid var(--bor);transform:translateX(100%);transition:transform .22s ease;
  z-index:61;display:flex;flex-direction:column}
.fiche.on{transform:none}
.fh{background:var(--sur);border-bottom:1px solid var(--bor);padding:15px 20px;display:flex;
  align-items:flex-start;gap:14px;flex:none}
.fh h2{font-size:var(--t4);font-weight:600;letter-spacing:-.25px;line-height:1.3;overflow-wrap:anywhere}
.fh .sub{font-size:var(--t1);margin-top:2px}
.fnav{display:flex;align-items:center;gap:4px;flex:none}
.btn.ic{padding:6px 8px}
.fpos{font-size:var(--t1);color:var(--tx3);font-variant-numeric:tabular-nums;padding:0 2px;white-space:nowrap}
.fb{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.blc{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px 17px}
.blt{font-size:var(--t0);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:var(--t0);
  color:var(--amb);text-decoration:none;border-bottom:1px solid transparent}
.src:hover{border-bottom-color:var(--amb)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(164px,1fr));gap:12px}
.f{min-width:0}.f.w{grid-column:1/-1}
.fl{font-size:var(--t0);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);
  margin-bottom:4px;display:block}
.fv{font-size:var(--t2);padding:2px 0;overflow-wrap:anywhere}
.fv.void{color:var(--tx3)}
.fv .u{font-size:var(--t1);color:var(--tx3);margin-left:3px}
.ed{width:100%;padding:7px 9px;border:1px solid var(--bor2);border-radius:var(--rs);background:var(--sur)}
.ed:focus{outline:none;border-color:var(--nav);box-shadow:0 0 0 3px rgba(27,58,83,.1)}
.ctl{display:flex;align-items:center;gap:7px}
.ctl .u{font-size:var(--t1);color:var(--tx3);flex:none}
.lien{font-size:var(--t1);color:var(--nav);background:none;border:none;cursor:pointer;padding:2px 0;
  text-decoration:underline;text-underline-offset:2px}
.regle{font-size:var(--t1);color:var(--tx2);margin-top:5px}
.dz{border:1px solid var(--bor);border-radius:var(--rs);padding:11px;margin-bottom:9px;background:var(--sur3)}
.dz:last-child{margin-bottom:0}
.dzh{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.dzh b{font-size:var(--t2);font-weight:600}
.dzh .aide{font-size:var(--t1);color:var(--tx3);min-width:0}
.dzh .n{margin-left:auto;font-size:var(--t0);color:var(--tx3);font-variant-numeric:tabular-nums}
.vign{display:flex;gap:9px;flex-wrap:wrap}
.vg{width:112px;height:112px;border-radius:var(--rs);border:1px solid var(--bor);background:var(--sur);
  overflow:hidden;display:grid;place-items:center;position:relative;text-decoration:none;color:var(--tx3)}
.vg img{width:100%;height:100%;object-fit:cover;display:block}
.vg i{font-size:20px}
.vg .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);font-size:9.5px;
  padding:2px 3px;text-align:center;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dzv{font-size:var(--t1);color:var(--tx3);padding:5px 0 8px}
.dzw{display:flex;gap:7px;align-items:flex-start;font-size:var(--t1);color:var(--tx2);
  background:var(--navbg);border:1px solid #d6dee6;border-radius:var(--rs);padding:9px 11px;margin-bottom:10px}
.dzw i{color:var(--nav);font-size:14px;flex:none;margin-top:1px}
.dzw.tm{background:var(--sur2);border-color:var(--bor);color:var(--tx3)}
.dzw.tm i{color:var(--tx3)}
.dzw b{color:var(--tx);font-weight:600}

/* ---------- bouton et page d'impression ---------- */
.expo{width:100%;justify-content:center;padding:11px 16px;font-size:var(--t2)}
#impr{display:none}

@media print{
  /* La page imprimee est la fiche, et rien d'autre. */
  body > *{display:none !important}
  body{background:#fff;color:#000;font-size:10.5pt}
  #impr{display:block !important}
  @page{size:A4 portrait;margin:15mm 16mm}
  #impr h1{font-size:17pt;font-weight:700;letter-spacing:-.3pt;line-height:1.2;margin:0 0 2mm}
  #impr h2{font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.9pt;color:#6b6760;
    margin:7mm 0 2.5mm;padding-bottom:1.2mm;border-bottom:.4pt solid #c9c5bc}
  .ph-t{display:flex;align-items:flex-start;justify-content:space-between;
    padding-bottom:4mm;margin-bottom:6mm;border-bottom:.8pt solid #1b3a53}
  .ph-t .brand{height:9mm;width:auto}
  .ph-r{text-align:right;line-height:1.5}
  .ph-r b{display:block;font-size:9pt;letter-spacing:.4pt;text-transform:uppercase}
  .ph-r span{font-size:8pt;color:#6b6760}
  .ph-s{font-size:9.5pt;color:#44413b;margin-bottom:1mm}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 8mm}
  .pl{display:flex;flex-direction:column;gap:.6mm;break-inside:avoid}
  .pl.w{grid-column:1/-1}
  .pl span{font-size:7.5pt;text-transform:uppercase;letter-spacing:.5pt;color:#8a867d}
  .pl b{font-size:10.5pt;font-weight:600;line-height:1.35}
  .pdl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm}
  .pd{break-inside:avoid}
  .pd span{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.5pt;color:#8a867d;
    margin-bottom:.8mm}
  .pd a{font-size:8.5pt;color:#1b3a53;word-break:break-all}
  .pd i{font-size:8.5pt;color:#8a867d}
  .pim{display:flex;gap:3mm;margin-top:4mm}
  .pim img{height:34mm;width:auto;border:.4pt solid #c9c5bc;border-radius:1mm}
  .pf{position:fixed;bottom:0;left:0;right:0;font-size:7.5pt;color:#8a867d;
    padding-top:2mm;border-top:.4pt solid #d8d4cb}
}

@media(max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;
    border-right:none;border-bottom:1px solid var(--bor);gap:12px}
  .rtop{padding:0;border-bottom:none;margin-bottom:0}
  .rlb{display:none}.rnav{flex-direction:row}.rsp{flex:1}
  .rbot{flex-direction:row;align-items:center;padding-top:0;border-top:none;gap:12px}
  .etat{max-width:320px}
}
@media(max-width:640px){ .main{padding:14px 12px 48px} }
</style>
</head><body>

<script>
/* --- app.js, en ligne --- */
/* ============================================================
   TFB — Info Pack · base packaging
   Une liste, une fiche. Douze informations, pas une de plus :
     Inpulse   — intitulé complet, SKU fournisseur, fournisseur,
                 conditionnement HA, tarif unitaire
     Wellembal — dimensions L/l/h, matière, grammage, personnalisé TFB
     Drive     — photos, BAT, gabarit
   Trois couches de données, dans cet ordre de priorité :
     1. data/packaging.json  — socle versionné dans le repo
     2. /api/store           — saisies TFB (Netlify Blobs)
     3. /api/proxy           — Inpulse, écrase ses propres champs
   Les règles métier (nommage, unités, matières) vivent dans config.js.
   ============================================================ */

let DB=null, OVR={records:{}}, ROWS=[], current=null, storeOk=false;

/* ---------- outils ---------- */
const eur  = n => (n==null||isNaN(n))?'—':n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc  = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isEmpty = v => v===''||v==null||(Array.isArray(v)&&!v.length);
const num = v => { if(v===''||v==null) return null;
  const x = typeof v==='number'?v:Number(String(v).replace(',','.').trim());
  return isNaN(x)?null:x; };
const todayISO = () => { const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dateFR = iso => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?m[3]+'/'+m[2]+'/'+m[1]:(iso||''); };
function getPath(o,p){ return p.split('.').reduce((a,k)=>(a==null?a:a[k]), o); }
function setPath(o,p,v){
  const ks=p.split('.'); let a=o;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(a[k]==null) a[k]= /^\d+$/.test(ks[i+1])?[]:{}; a=a[k]; }
  a[ks[ks.length-1]]=v;
}
const norm = s => String(s==null?'':s).toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ---------- intitule ---------- */
function calcMode(r,valuePath,modePath){
  const m=getPath(r,modePath);
  if(m==='manuel'||m==='auto') return m;
  return isEmpty(getPath(r,valuePath))?'auto':'manuel';
}
const versionDesign = r => {
  const m=/(?:^|[\s(\-])(\d{1,2})\s*\/\s*(20\d{2})(?![\d])/
    .exec((r&&r.identification&&r.identification.intitule_inpulse)||'');
  return m ? String(m[1]).padStart(2,'0')+'/'+m[2] : '';
};
function intituleBase(r){
  let n=String((r&&r.identification&&r.identification.intitule_inpulse)||'').trim();
  INTITULE.retirer.forEach(re=>{ n=n.replace(re,' '); });
  return n.replace(/\s{2,}/g,' ').trim();
}
function intituleAuto(r){
  const base=intituleBase(r); if(!base) return '';
  const mention=INTITULE.mentions[r.app&&r.app.marquage];
  if(!mention) return base+' '+INTITULE.mention_neutre;
  const v=versionDesign(r);
  return base+' '+mention+(v?' '+v:'');
}
const intituleMode  = r => calcMode(r,'identification.intitule_complet','identification.intitule_mode');
const intituleValue = r => intituleMode(r)==='manuel'
  ? (getPath(r,'identification.intitule_complet')||'') : intituleAuto(r);

/* ---------- achat ---------- */
const uniteCommande = n => { const u=(n||'').toUpperCase();
  return u.indexOf('CARTON')===0?'Carton':u.indexOf('BOITE')===0?'Boîte':u.indexOf('ROULEAU')===0?'Rouleau'
    :(u.indexOf("L'UNITE")>=0||u.indexOf('L UNITE')>=0)?'Unité':(n||''); };
const uniteTarif = r => (r&&r.logistique&&r.logistique.unite_tarif) || UNITE_TARIF_DEFAUT;
function conditionnementHA(r){
  let u=String((r&&r.inpulse&&r.inpulse.unite_achat)||'').trim();
  if(!u && r && r._wel && r._wel.conditionnement) u=r._wel.conditionnement;
  const n=num(r&&r.logistique&&r.logistique.nombre_par_carton);
  const par=n?(fmt(n)+' '+uniteTarif(r)+(n>1?'s':'')):'';
  if(u&&par) return u+' — '+par;
  return u||par;
}

/* ---------- inpulse ---------- */
const FAMILLE_REGLES = [
  [/\bCOUVERCLE/,                                      'Couvercle'],
  [/\bBAGUE/,                                          'Bague'],
  [/\bBOUTEILLE/,                                      'Bouteille'],
  [/\bBOWL|\bBOL\b/,                                   'Bowl'],
  [/\bGOBELET/,                                        'Gobelet'],
  [/\bSERVIETTE/,                                      'Serviette'],
  [/\bETIQUETTE|\bÉTIQUETTE|\bCOLLERETTE/,             'Étiquette'],
  [/\bSAC\b|\bSACHET|\bSACS\b|\bPOCHETTE|\bTOTE\b/,    'Sac'],
  [/\bBOITE|\bBOÎTE|\bCAISSE|\bBARQUETTE|\bCOFANETTO|\bETUI|\bÉTUI/, 'Boîte'],
  [/\bPAPIER|\bBOBINE|\bROULEAU|\bFILM\b|\bDEPLIANT|\bDÉPLIANT|\bTABLETTE/, 'Papier'],
  [/\bCOUTEAU|\bFOURCHETTE|\bCUILLERE|\bCUILLÈRE|\bCOUVERTS|\bKIT\b/, 'Couverts'],
  [/\bMUG\b|\bTASSE|\bASSIETTE|\bMOULE|\bCAISSETTE|\bTULIPCUP/, 'Vaisselle']
];
const familleDe = nom => { const n=String(nom||'').toUpperCase();
  for(const [re,f] of FAMILLE_REGLES) if(re.test(n)) return f;
  return 'Accessoire'; };
const marquageDe = nom => { const n=String(nom||'').toUpperCase();
  if(/\bTFB\b|THE FRENCH BASTARDS/.test(n)) return /\bX\b/.test(n)?'Co-branding':'TFB';
  return 'Neutre'; };
const slugId = nom => String(nom||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,90) || 'ref';
function idUnique(base, pris){ let id=base, n=2;
  while(pris[id]) id=base+'-'+(n++); pris[id]=1; return id; }
function appliquerInpulse(p,m){
  const pk=m.packaging||{};
  p.inpulse.live=true;
  if(m.price!=null)   p.inpulse.prix_ht=Number(m.price);
  if(m.supplier)      p.inpulse.fournisseur=m.supplier;
  if(m.subCategory)   p.inpulse.sous_categorie=m.subCategory;
  p.inpulse.unite_achat=pk.name||'';
  p.inpulse.actif=m.active;
  p.identification.sku_fournisseur=(m.sku&&m.sku!=='?')?m.sku:'';
  const q=pk.quantity;
  p.logistique.nombre_par_carton=(q&&q>1)?q:null;
  p.logistique.unite_commande=uniteCommande(pk.name);
  p.logistique.prix_unitaire_ht=(q&&q>1&&m.price)?m.price/q:null;
}
function fichePackaging(m,id){
  const nom=String(m.name||'').trim();
  const p={
    id:id, nom:nom, _nouveau:true,
    app:{famille:familleDe(nom), marquage:marquageDe(nom), statut:'À compléter'},
    inpulse:{prix_ht:null, dispo:null, fournisseur:'', categorie:m.category||'PACKAGING',
             sous_categorie:'', ingredient:null, unite_achat:''},
    identification:{intitule_inpulse:nom, sku_fournisseur:''},
    dimensions:{longueur_cm:null, largeur_cm:null, profondeur_soufflet_cm:null,
                hauteur_cm:null, dimensions_a_plat_cm:'', tolerance_mm:null},
    matiere:{matiere:'', grammage_g_m2:null, epaisseur_um:null,
             poids_unitaire_g:null, contact_alimentaire:null},
    design:{design_valide_tfb:'', gabarit_fournisseur:'', logo:'',
            couleurs:{pantone_principal:'', pantone_secondaire:'', pantone_tertiaire:'',
                      nb_couleurs_impression:null},
            support_rendu:{type_support:'', grammage_g_m2:null, finition:''},
            bat:{valide_par:'', date_validation:'', fichier:''},
            mentions_obligatoires:{denomination_produit:'', poids_contenance:'', allergenes:'',
                                   ddm_dlc:'', adresse_raison_sociale:'', logo_tri_recyclabilite:''}},
    logistique:{nombre_par_carton:null, cartons_par_palette:null, conditions_stockage:'',
                moq:null, delai_reappro_jours:null, unite_commande:'', prix_unitaire_ht:null},
    deploiement:{points_de_vente:[], date_mise_en_service:'', date_fin_service:'',
                 points_de_vigilance:''},
    usage_tfb:{recettes_concernees:[], usage:'', quantite_par_emballage:null},
    photos:['','','','']
  };
  appliquerInpulse(p,m);
  return p;
}
async function scanViaProxy(){
  const PAGE=100, MAX=30; let rows=[];
  for(let page=0;page<MAX;page++){
    const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({endpoint:'/public/v2/supplier-products?limit='+PAGE+'&skip='+(page*PAGE),method:'GET'})});
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); }
    const d=await r.json(); const batch=d.data||[];
    rows=rows.concat(batch);
    setConn('spin','Interrogation d’Inpulse…', rows.length+' / '+(d.total||'?')+' références lues');
    if(batch.length<PAGE) break;
  }
  return rows.filter(x=>x&&x.category==='PACKAGING').map(x=>{
    const p=(x.packagings||[]).find(q=>q.isUsedInOrder)||(x.packagings||[])[0]||{};
    return {name:String(x.name||'').trim(), sku:String(x.sku||'').trim(),
            price:x.price==null?null:Number(x.price), active:!!x.active,
            category:x.category, subCategory:x.subCategory,
            supplier:(x.supplier&&x.supplier.name)||'',
            packaging:{name:String(p.name||'').trim(), quantity:p.quantity==null?null:Number(p.quantity), unit:p.unit||''}};
  });
}
async function syncInpulse(){
  setConn('spin','Interrogation d’Inpulse…','');
  try{
    let list=null, via='';
    try{
      const r=await fetch('/api/packaging',{cache:'no-store'});
      if(r.ok){ const d=await r.json(); if(d.data&&d.data.length){ list=d.data; via='via /api/packaging'; } }
    }catch(e){}
    if(!list){ list=await scanViaProxy(); via='via /api/proxy'; }
    if(!list.length) throw new Error('aucune référence PACKAGING renvoyée');

    const by={}; list.forEach(x=>{ if(x.name) by[String(x.name).trim().toUpperCase()]=x; });
    let hit=0; const orphans=[];
    DB.packagings.forEach(p=>{
      const m=by[p.identification.intitule_inpulse.trim().toUpperCase()];
      if(!m){ orphans.push(p.nom); return; }
      hit++;
      appliquerInpulse(p,m);
    });

    /* Références Inpulse sans fiche : création. Inpulse pouvant renvoyer
       deux fois le même libellé, la clé de rapprochement (le nom) fait foi. */
    const known={}, pris={};
    DB.packagings.forEach(p=>{ known[p.identification.intitule_inpulse.trim().toUpperCase()]=1; pris[p.id]=1; });
    const nouvelles=[];
    list.forEach(x=>{
      const nom=String(x.name||'').trim(); if(!nom) return;
      const cle=nom.toUpperCase(); if(known[cle]) return;
      known[cle]=1;
      DB.packagings.push(fichePackaging(x, idUnique(slugId(nom), pris)));
      nouvelles.push(nom);
    });
    if(nouvelles.length){
      hit+=nouvelles.length;
      appliquerWellembal();
      applyOverrides();     // saisies TFB déjà enregistrées sur ces nouvelles fiches
      indexerDrive();       // les nouvelles fiches reprennent leurs photos
      refreshFournisseurs();
    }

    let note='prix, SKU et conditionnements à jour — '+via;
    if(nouvelles.length) note+=' · '+nouvelles.length+' réf. ajoutée(s) depuis Inpulse : '+nouvelles.join(', ');
    if(orphans.length)   note+=' · non retrouvée(s) dans Inpulse : '+orphans.join(', ');
    setConn(orphans.length?'warn':'ok',
      '<strong>Inpulse connecté<\/strong> — '+hit+' / '+DB.packagings.length+' références rapprochées', note);
    if(current) openDrawer(current.id);
    render();
  }catch(e){
    setConn('err','<strong>Inpulse non joignable<\/strong> — affichage du dernier extrait','('+e.message+')');
  }
}

/* ---------- stockage ---------- */
async function loadOverrides(){
  try{
    const r=await fetch('/api/store',{cache:'no-store'});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));
    OVR = await r.json(); if(!OVR.records) OVR.records={};
    storeOk=true;
    applyOverrides();
    setSave('ok', OVR.updated_at ? 'Dernière saisie ' + new Date(OVR.updated_at).toLocaleString('fr-FR') : 'Aucune saisie enregistrée');
  }catch(e){
    storeOk=false; OVR={records:{}};
    setSave('err','Saisie non enregistrée — ' + e.message);
  }
}
function applyOverrides(){
  DB.packagings.forEach(p=>{
    const o=OVR.records[p.id]; if(!o) return;
    Object.keys(o).forEach(path=>setPath(p,path,o[path]));
  });
}
function setConn(s,t,d){
  document.getElementById('dot').className='dot '+s;
  const box=document.getElementById('connbox'), det=document.getElementById('conn-d'),
        more=document.getElementById('conn-more'), txt=String(d==null?'':d).trim();
  const court = txt.length<=110;
  document.getElementById('conn-t').innerHTML = t + (court&&txt?' <span class="sm">'+esc(txt)+'<\/span>':'');
  if(!det||!more) return;
  if(court){
    det.textContent=''; det.classList.remove('on'); more.classList.remove('on');
    more.style.display='none'; if(box) box.classList.remove('open');
    return;
  }
  det.textContent=txt;
  more.style.display='inline-flex';
  const ouvert=det.classList.contains('on');
  more.innerHTML=(ouvert?'Masquer le d\u00e9tail':'D\u00e9tail')+'<i class="ti ti-chevron-down"><\/i>';
  more.classList.toggle('on',ouvert);
  if(box) box.classList.toggle('open',ouvert);
}
function setSave(s,t){ const el=document.getElementById('save'); if(!el) return;
  el.className='savebadge '+s; el.innerHTML='<i class="ti '+(s==='ok'?'ti-cloud-check':s==='wait'?'ti-cloud-upload':'ti-cloud-off')+'"><\/i>'+esc(t); }
const QUEUE=[]; let flushT=null, inflight=false;
function saveField(id,path,value){
  const rec=DB.packagings.find(p=>p.id===id); if(rec) setPath(rec,path,value);
  const o=OVR.records[id]||(OVR.records[id]={});
  if(isEmpty(value)) delete o[path]; else o[path]=value;
  if(!Object.keys(o).length) delete OVR.records[id];
  if(!storeOk){ setSave('err','Saisie gardée en mémoire seulement — stockage indisponible'); refreshHeader(); render(); return; }
  const i=QUEUE.findIndex(q=>q.id===id&&q.path===path);
  const op={id,path,value:isEmpty(value)?null:value};
  if(i>=0) QUEUE[i]=op; else QUEUE.push(op);
  setSave('wait','Enregistrement…');
  clearTimeout(flushT); flushT=setTimeout(flush,600);
  refreshHeader(); render();
}
async function flush(){
  if(inflight||!QUEUE.length) return;
  const ops=QUEUE.splice(0,QUEUE.length); inflight=true;
  try{
    const r=await fetch('/api/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ops})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    OVR.updated_at=d.updated_at;
    setSave('ok','Enregistré à '+new Date(d.updated_at).toLocaleTimeString('fr-FR')+' · '+d.fiches_modifiees+' fiche(s) saisie(s)');
  }catch(e){
    ops.forEach(o=>QUEUE.push(o));
    setSave('err','Échec de l’enregistrement — '+e.message+' (nouvelle tentative dans 10 s)');
    setTimeout(flush,10000);
  }finally{ inflight=false; if(QUEUE.length){ clearTimeout(flushT); flushT=setTimeout(flush,800); } }
}
const eur4 = n => (n==null||isNaN(n))?'—':n.toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:4})+' €';
const fmt  = n => (n==null||isNaN(n))?'—':(Math.round(n*100)/100).toLocaleString('fr-FR');
/* ============================================================
   Interface — une liste, une fiche.
   La fiche ne porte que les douze informations demandées :
   cinq viennent d'Inpulse, six se saisissent ici, trois sont
   des documents. Tout le reste a été retiré de l'app.
   ============================================================ */

/* ---------- documents ---------- */
/* Deux sources, fusionnées : les liens collés à la main (enregistrés
   dans /api/store) et, quand la fonction /api/drive est configurée,
   le contenu du dossier Drive de la référence. */
let DRIVE={pret:false, fichiers:[], par:{}, message:''};

const liensManuels = (r,k) => { const v=getPath(r,'documents.'+k); return Array.isArray(v)?v:[]; };
/* Un meme fichier peut etre a la fois le BAT et le gabarit : « SACHET
   BAGUETTE TFB DESIGN+GABARIT.pdf » est les deux. Le classement du
   script ne retient qu'une categorie, on le refait donc ici, ou les
   regles metier ont leur place, et on autorise les deux. */
const MOTS_DOC = {
  bat:     /BONATIRER|\bBAT\b|BATUSINE|DESIGN|GRAPHIQUE|MAQUETTE/,
  gabarit: /GABARIT|GABRIT|DIELINE|DECOUPE|PLAN/,
  photos:  /PHOTO|VISUEL|PACKSHOT|MISEENSITUATION/
};
function estDe(f,k){
  const n=code(f.nom+' '+((f.chemin||[]).join(' ')));
  const image=/^image\//.test(f.mime||'') || estImage(f.nom||'');
  if(k==='photos') return image || MOTS_DOC.photos.test(n);
  if(image) return false;
  if(MOTS_DOC[k].test(n)) return true;
  /* un document qui ne dit rien de lui-meme reste un gabarit */
  return k==='gabarit' && !MOTS_DOC.bat.test(n) && !MOTS_DOC.gabarit.test(n);
}
const fichiersDrive = (r,k) => (DRIVE.par[r.id]||[]).filter(f=>estDe(f,k));

/* Rattacher les fichiers du Drive aux references. On n'impose aucune
   arborescence : un fichier revient a une reference si son nom, ou le
   nom d'un dossier qui le contient, porte le SKU fournisseur, la
   reference Wellembal ou l'intitule Inpulse. Le repere le plus long
   l'emporte, pour qu'un code court n'attrape pas la voisine. */
/* Ressemblance de deux libelles : coefficient de Dice sur les paires
   de lettres. Insensible a l'ordre des mots, tolerant aux fautes.
   « GOBLET 10 CL TFB » et « GOBELET 10CL TFB » valent 0,88 ;
   « ROULEAU ETIQUETTE CAKE MARBRE » et « ETIQUETTES EN ROULEAU CAKE
   MARBRE » 0,84 ; deux produits differents restent sous 0,60. */
function paires(s){
  const m=new Map();
  for(let i=0;i<s.length-1;i++){ const k=s.slice(i,i+2); m.set(k,(m.get(k)||0)+1); }
  return m;
}
function dice(a,A,b,B){
  if(!a||!b) return 0;
  let c=0,na=0,nb=0;
  A.forEach(v=>na+=v); B.forEach(v=>nb+=v);
  A.forEach((v,k)=>{ const w=B.get(k); if(w) c+=Math.min(v,w); });
  return (na+nb) ? 2*c/(na+nb) : 0;
}
/* Seuils mesures sur les 31 dossiers reels du Drive packaging :
   toutes les bonnes paires passent, aucune mauvaise ne passe. */
const RESSEMBLANCE = 0.70;   // en dessous, ce n'est pas le meme produit
const ECART        = 0.09;   // ecart minimum avec la deuxieme candidate

function indexerDrive(){
  DRIVE.par={};
  if(!DB||!DRIVE.fichiers.length) return;
  const cles=DB.packagings.map(r=>{
    const cs=[
      code(r.identification&&r.identification.sku_fournisseur),
      code(r._welk),
      code(r.identification&&r.identification.intitule_inpulse),
      code(r.nom),
      code(intituleValue(r)),
      code(intituleBase(r))
    ].filter((c,i,t)=>c && c.length>=5 && t.indexOf(c)===i);
    return {r, cs, pp:cs.map(paires)};
  });

  /* Les correspondances ecrites a la main passent avant tout le reste. */
  const manuelles=[];
  (typeof CORRESPONDANCES!=='undefined'?CORRESPONDANCES:[]).forEach(c=>{
    /* Un dossier peut porter plusieurs references : le bol et son couvercle. */
    const refs=[].concat(c.reference||[]).map(code).filter(Boolean);
    const trouvees=refs.map(cible =>
        (cles.find(o=>o.cs.indexOf(cible)>=0)
      || cles.find(o=>o.cs.some(x=>x.indexOf(cible)>=0)) || {}).r
    ).filter(Boolean);
    if(trouvees.length) manuelles.push({d:code(c.dossier), rs:trouvees});
  });
  /* Le libelle le plus long gagne : COUVERCLE GOBLET 25CL TRANSPARENT
     doit passer avant COUVERCLE GOBLET 25CL, qui en est un prefixe. */
  manuelles.sort((a,b)=>b.d.length-a.d.length);

  /* Un abrege court ne vaut que s'il ne designe qu'une seule reference. */
  const compte={};
  const unique = b => {
    if(!(b in compte))
      compte[b]=cles.filter(o=>o.cs.some(c=>c.indexOf(b)>=0)).length;
    return compte[b]===1;
  };

  DRIVE.fichiers.forEach(f=>{
    const bruts=(f.chemin||[]).concat([String(f.nom||'').replace(/\.[a-z0-9]{1,5}$/i,'')]);
    const bouts=bruts.map(code).filter(c=>c.length>=5);
    const foin=code((f.chemin||[]).join(' ')+' '+f.nom);

    /* 0. une correspondance validee a la main */
    const mm=manuelles.find(x=>x.d && (foin.indexOf(x.d)>=0 || bouts.some(b=>b.indexOf(x.d)>=0)));
    if(mm){ mm.rs.forEach(r=>(DRIVE.par[r.id]||(DRIVE.par[r.id]=[])).push(f)); return; }

    /* 1. le nom porte la reference, ou l'abrege : rapprochement sur */
    let gagnant=null, score=0;
    cles.forEach(o=>o.cs.forEach(c=>{
      let n=0;
      if(bouts.indexOf(c)>=0)        n=2000+c.length;
      else if(foin.indexOf(c)>=0)    n=1000+c.length;
      else bouts.forEach(b=>{
        if(b.length>=5 && c.indexOf(b)>=0 && b.length>n && unique(b)) n=b.length; });
      if(n>score){ score=n; gagnant=o.r; }
    }));
    if(gagnant){ (DRIVE.par[gagnant.id]||(DRIVE.par[gagnant.id]=[])).push(f); return; }

    /* 2. sinon, la ressemblance, a condition qu'elle soit nette */
    const bp=bouts.map(paires);
    let m1=0, r1=null, m2=0;
    cles.forEach(o=>{
      let m=0;
      for(let i=0;i<bouts.length;i++)
        for(let j=0;j<o.cs.length;j++){
          const d=dice(bouts[i],bp[i],o.cs[j],o.pp[j]); if(d>m) m=d;
        }
      if(m>m1){ m2=m1; m1=m; r1=o.r; } else if(m>m2) m2=m;
    });
    if(r1 && m1>=RESSEMBLANCE && m1-m2>=ECART)
      (DRIVE.par[r1.id]||(DRIVE.par[r1.id]=[])).push(f);
  });
}

/* les fichiers du Drive qu'aucune reference ne reclame */
function orphelinsDrive(){
  if(!DRIVE.pret) return [];
  const pris=new Set();
  Object.keys(DRIVE.par).forEach(id=>DRIVE.par[id].forEach(f=>pris.add(f)));
  return DRIVE.fichiers.filter(f=>!pris.has(f));
}
function dossierDrive(r){
  const f=(DRIVE.par[r.id]||[])[0];
  return (f&&f.dossier_url) || DRIVE.racine || '';
}
function documentsDe(r,k){
  return fichiersDrive(r,k).concat(
    liensManuels(r,k).map(u=>({nom:nomDeLien(u), url:u, vignette:null, manuel:true})));
}
const estImage = u => /\.(png|jpe?g|webp|gif|avif)(\?|$)/i.test(u||'');
/* Le script renvoie l'identifiant du fichier ; la vignette passe par
   notre propre fonction, parce qu'une adresse Drive directe exige une
   session Google que la page n'a pas. Un lien colle a la main garde
   son adresse telle quelle. */
const vignetteURL = x => /^https?:/i.test(x.vignette||'')
  ? x.vignette : '/api/image?id='+encodeURIComponent(x.vignette);
function nomDeLien(u){
  try{ const p=new URL(u).pathname.split('/').filter(Boolean); return decodeURIComponent(p[p.length-1]||u); }
  catch(e){ return u; }
}

/* frais=1 : on redemande au Drive sans attendre la fin du cache de la
   fonction. C'est ce que fait le bouton Synchroniser, pour qu'une photo
   deposee a l'instant apparaisse tout de suite. */
async function chargerDrive(frais){
  try{
    const r=await fetch('/api/drive'+(frais?'?frais=1':''),{cache:'no-store'});
    if(r.status===501){ DRIVE.message=(await r.json().catch(()=>({}))).error||'Drive non configuré'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    DRIVE.fichiers=d.fichiers||[];
    DRIVE.racine='https://drive.google.com/drive/folders/'+(d.parent||'');
    DRIVE.pret=true; indexerDrive();
    render(); if(current) ouvrir(current.id);
  }catch(e){ DRIVE.message=e.message; }
}

/* ---------- couleurs d'impression ---------- */
/* Les Pantone sont ecrits dans les BAT. On les a releves une fois dans
   la couche texte des PDF, fichier par fichier ; les BAT sans couche
   texte ne peuvent pas etre lus et restent vides. */
let PANTONE=null;
async function chargerPantone(){
  if(typeof EMBEDDED_PAN!=='undefined'){ PANTONE=EMBEDDED_PAN; if(current) ouvrir(current.id); return; }
  try{
    const r=await fetch('data/pantone.json',{cache:'no-store'});
    if(!r.ok) return;
    PANTONE=await r.json();
    if(current) ouvrir(current.id);
  }catch(e){}
}
/* Les couleurs de la reference : celles relevees dans ses BAT. */
function couleursDe(r){
  if(!PANTONE||!PANTONE.fichiers||!r) return [];
  const vus=new Set(), out=[];
  DOCUMENTS.forEach(d=>{
    if(d.k==='photos') return;
    documentsDe(r,d.k).forEach(f=>{
      const c=PANTONE.fichiers[f.id]; if(!c) return;
      (c.couleurs||[]).forEach(x=>{ if(!vus.has(x)){ vus.add(x); out.push(x); } });
      if(c.vernis && !vus.has('Vernis')){ vus.add('Vernis'); out.push('Vernis'); }
    });
  });
  return out;
}
function sourceCouleurs(r){
  if(!PANTONE||!PANTONE.fichiers||!r) return '';
  const l=[];
  DOCUMENTS.forEach(d=>{
    if(d.k==='photos') return;
    documentsDe(r,d.k).forEach(f=>{
      const c=PANTONE.fichiers[f.id];
      if(c&&c.releve&&l.indexOf(c.releve)<0) l.push(c.releve);
    });
  });
  return l.join(' · ');
}
/* Les Pantone seuls : couleursDe y ajoute Vernis, qui a son propre champ. */
const pantonesDe = r => couleursDe(r).filter(c=>c!=='Vernis');

/* Le vernis : ce qu'on a saisi, sinon ce que dit le BAT. */
function vernisDe(r){
  const v=getPath(r,'design.couleurs.vernis');
  if(v===true||v===false) return v;
  if(!PANTONE||!PANTONE.fichiers||!r) return null;
  let vu=null;
  DOCUMENTS.forEach(d=>{
    if(d.k==='photos') return;
    documentsDe(r,d.k).forEach(f=>{
      const c=PANTONE.fichiers[f.id];
      if(c && typeof c.vernis==='boolean' && vu===null) vu=c.vernis;
    });
  });
  return vu;
}

/* Les couleurs retenues, pour l'export et le PDF : la saisie manuelle
   l'emporte sur le BAT, parce qu'un BAT peut dater et que seuls sept
   d'entre eux ont une couche texte lisible. */
function couleursRef(r){
  const m=String(getPath(r,'design.couleurs.pantone')||'').trim();
  if(m) return m;
  return pantonesDe(r).join(' + ');
}

/* ---------- referentiel Wellembal ---------- */
/* Le fournisseur tient a jour un referentiel : dimensions, matiere,
   grammage, type, stock et sorties sur six mois. On le rapproche sur la
   reference Wellembal, qui est le SKU fournisseur d'Inpulse ; a defaut
   sur le libelle Inpulse. Ses valeurs servent de socle : une saisie TFB
   les recouvre toujours. */
let WEL=null;

/* ---------- lecture du classeur fournisseur ---------- */
/* Wellembal tient son referentiel dans un classeur Drive. Le script
   Apps Script nous le rend feuille par feuille, en lignes brutes ;
   la mise en forme se fait ici, pour que les regles restent dans
   l'app et pas dans le script. */

const NB_WEL = '\\d+(?:[.,]\\d+)?';
const nbWel = x => { const v=parseFloat(String(x==null?'':x).replace(',','.'));
                     return isFinite(v)?v:null; };
const txtWel = x => { const v=String(x==null?'':x).replace(/\s+/g,' ').trim(); return v||null; };

function diviseurWel(t){
  const b=String(t).toLowerCase();
  if(b.indexOf('mm')>=0) return 10;
  if(/\bcm\b/.test(b)||/cm$/.test(b.trim())) return 1;
  return null;
}
/* Rend [L, l, h] en centimetres. Sept notations couvertes, des
   « 120x58x57 mm » aux « Diam. haut 183 x diam. bas 164 x H 50 mm ». */
function cotesWel(t){
  if(!t) return [null,null,null];
  t=String(t).trim();
  let div=diviseurWel(t);
  if(div==null) div=new RegExp('\\bD\\s*'+NB_WEL+'\\s*H\\s*'+NB_WEL,'i').test(t)?1:null;
  if(div==null) return [null,null,null];
  const u=v=>Math.round(nbWel(v)/div*100)/100;

  let m=t.match(new RegExp('Ext\\.?\\s*('+NB_WEL+')\\s*[x\u00d7]\\s*('+NB_WEL+')\\s*[x\u00d7]\\s*('+NB_WEL+')','i'));
  if(m) return [u(m[1]),u(m[2]),u(m[3])];

  const d=t.match(new RegExp('(?:diam\\.?|D|haut|bas)\\s*\\.?\\s*('+NB_WEL+')','gi'))||[];
  const h=t.match(new RegExp('(?:\\bH|hauteur)\\s*\\.?\\s*('+NB_WEL+')','i'));
  if(d.length>=2&&h){
    const g=Math.max.apply(null,d.map(x=>nbWel((x.match(new RegExp(NB_WEL))||[0])[0])));
    const c=Math.round(g/div*100)/100;
    return [c,c,u(h[1])];
  }

  const p=t.replace(new RegExp('('+NB_WEL+')\\s*/\\s*'+NB_WEL,'g'),'$1');
  m=p.match(new RegExp('('+NB_WEL+')\\s*[x\u00d7]\\s*('+NB_WEL+')\\s*[x\u00d7]\\s*('+NB_WEL+')'));
  if(m) return [u(m[1]),u(m[2]),u(m[3])];

  m=t.match(new RegExp('(?:^|[^x\u00d7\\d])('+NB_WEL+')\\s*/\\s*('+NB_WEL+')\\s*/\\s*('+NB_WEL+')'));
  if(m) return [u(m[1]),u(m[2]),u(m[3])];

  const dd=t.match(new RegExp('\\bD\\s*\\.?\\s*('+NB_WEL+')'));
  if(dd){ const g=u(dd[1]); return [g,g,h?u(h[1]):null]; }

  m=p.match(new RegExp('('+NB_WEL+')\\s*[x\u00d7]\\s*('+NB_WEL+')'));
  if(m) return [u(m[1]),u(m[2]),h?u(h[1]):null];

  return [null,null,null];
}

/* Retrouver les colonnes par leur intitule, pour que l'app survive a
   un deplacement de colonne chez le fournisseur. */
function enteteWel(lignes){
  for(let i=0;i<Math.min(lignes.length,25);i++)
    if(lignes[i].some(c=>code(c).indexOf('REFERENCEWELLEMBAL')>=0)) return i;
  return -1;
}
function colWel(entete, motifs){
  for(let i=0;i<entete.length;i++){
    const h=code(entete[i]);
    if(h && motifs.some(m=>h.indexOf(m)>=0)) return i;
  }
  return -1;
}
function construireWel(brut){
  const F=(brut&&brut.feuilles)||{};
  const actives=F['Referentiel packaging']||[];
  const archives=F['References archivees']||[];
  const refs={};

  const ia=enteteWel(actives);
  if(ia>=0){
    const e=actives[ia];
    const C={
      ref:colWel(e,['REFERENCEWELLEMBAL']), des:colWel(e,['DESIGNATION']),
      typ:colWel(e,['TYPE']), inp:colWel(e,['NOMINPULSE']),
      fam:colWel(e,['FAMILLE']), dim:colWel(e,['DIMENSION']),
      mat:colWel(e,['MATIERE']), gra:colWel(e,['GRAMMAGE']),
      con:colWel(e,['CONDITIONNEMENT']), poi:colWel(e,['POIDSCOLIS']),
      prx:colWel(e,['PRIXHT']), stk:colWel(e,['STOCKDISPO']),
      enc:colWel(e,['ENCOURS']), del:colWel(e,['DELAIREAPPRO']),
      cs6:colWel(e,['CONSO6MOIS']), bat:colWel(e,['BATGABARIT']),
      obs:colWel(e,['OBSERVATION'])
    };
    const g=(l,k)=>C[k]>=0?l[C[k]]:null;
    for(let i=ia+1;i<actives.length;i++){
      const l=actives[i], r=txtWel(g(l,'ref'));
      if(!r) continue;
      refs[r]={
        designation:txtWel(g(l,'des')), type:txtWel(g(l,'typ')),
        nom_inpulse:txtWel(g(l,'inp')), famille:txtWel(g(l,'fam')),
        dimensions_texte:txtWel(g(l,'dim')), cotes_cm:cotesWel(g(l,'dim')),
        matiere:txtWel(g(l,'mat')), grammage:nbWel(g(l,'gra')),
        conditionnement:txtWel(g(l,'con')), poids_colis_kg:nbWel(g(l,'poi')),
        prix_colis:nbWel(g(l,'prx')), stock:nbWel(g(l,'stk')),
        en_cours:nbWel(g(l,'enc')), delai_reappro:nbWel(g(l,'del')),
        conso6:nbWel(g(l,'cs6')),
        bat_gabarit:/^OUI/.test(code(g(l,'bat'))), observations:txtWel(g(l,'obs')),
        archivee:null
      };
    }
  }

  const ib=enteteWel(archives);
  if(ib>=0){
    const e=archives[ib];
    const C={ ref:colWel(e,['REFERENCEWELLEMBAL']), des:colWel(e,['DESIGNATION']),
      typ:colWel(e,['TYPE']), dim:colWel(e,['DIMENSION']), mat:colWel(e,['MATIERE']),
      con:colWel(e,['CONDITIONNEMENT']), cs6:colWel(e,['SORTIES6MOIS']),
      sta:colWel(e,['STATUT']) };
    const g=(l,k)=>C[k]>=0?l[C[k]]:null;
    for(let i=ib+1;i<archives.length;i++){
      const l=archives[i], r=txtWel(g(l,'ref'));
      if(!r||refs[r]) continue;
      refs[r]={
        designation:txtWel(g(l,'des')), type:txtWel(g(l,'typ')), nom_inpulse:null,
        famille:null, dimensions_texte:txtWel(g(l,'dim')), cotes_cm:cotesWel(g(l,'dim')),
        matiere:txtWel(g(l,'mat')), grammage:null, conditionnement:txtWel(g(l,'con')),
        poids_colis_kg:null, prix_colis:null, stock:null, en_cours:null,
        delai_reappro:null, conso6:nbWel(g(l,'cs6')), bat_gabarit:false,
        observations:null, archivee:txtWel(g(l,'sta'))||'Référence désactivée'
      };
    }
  }

  /* la date d'edition est annoncee dans les premieres lignes */
  let ed='';
  for(let i=0;i<Math.min(actives.length,5);i++){
    const m=actives[i].join(' ').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m){ ed=m[3]+'-'+m[2]+'-'+m[1]; break; }
  }
  return {source:'Référentiel packaging TFB — WELLEMBAL', edition:ed,
          lu_le:(brut&&brut.genere)||'', refs};
}

async function chargerWellembal(frais){
  const poser = () => { appliquerWellembal(); applyOverrides(); indexerDrive(); render(); };
  if(typeof EMBEDDED_WEL!=='undefined'){ WEL=EMBEDDED_WEL; poser(); return; }
  /* 1. le classeur vivant, par le script */
  try{
    const r=await fetch('/api/wellembal'+(frais?'?frais=1':''),{cache:'no-store'});
    if(r.ok){
      const b=await r.json();
      if(!b.error && b.feuilles){
        const w=construireWel(b);
        if(Object.keys(w.refs).length){ WEL=w; poser(); return; }
      }
    }
  }catch(e){}
  /* 2. a defaut, la copie figee deposee avec l'app */
  try{
    const r=await fetch('data/wellembal.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    WEL=await r.json(); poser();
  }catch(e){ WEL=null; }
}
const code = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^A-Za-z0-9]/g,'').toUpperCase();
let WELIDX=null;
/* Inpulse et Wellembal n'ecrivent pas les references pareil :
   WEBOL900D183KF / BOL900D183KF, TFBBECLAIR... / STARDSBECLAIR...
   On rapproche en quatre temps, du plus sur au moins sur. */
const racine = c => String(c||'')
  .replace(/^(?:THEFRENCHBASTARDS|BASTARDS|STARDS|TFB|WE)/,'')
  .replace(/V\d+$/,'');
const chiffres = c => (String(c||'').match(/\d+/g)||[]).join('');
function indexerWel(){
  WELIDX={sku:{}, rac:{}, nom:{}, nb:{}};
  const nbDouble={};
  for(const k in WEL.refs){
    const c=code(k);
    WELIDX.sku[c]=k;
    const ra=racine(c); if(ra && !(ra in WELIDX.rac)) WELIDX.rac[ra]=k;
    const n=WEL.refs[k].nom_inpulse;
    if(n && !(code(n) in WELIDX.nom)) WELIDX.nom[code(n)]=k;
    const d=chiffres(c);
    if(d.length>=5){ nbDouble[d]=(nbDouble[d]||0)+1; WELIDX.nb[d]=k; }
  }
  /* une signature chiffree ne vaut que si elle ne designe qu'une reference */
  Object.keys(nbDouble).forEach(d=>{ if(nbDouble[d]>1) delete WELIDX.nb[d]; });
}
function cleWel(r){
  if(!WEL||!WEL.refs) return '';
  if(!WELIDX) indexerWel();
  const sku=code((r.identification&&r.identification.sku_fournisseur));
  if(sku && WELIDX.sku[sku]) return WELIDX.sku[sku];
  const ra=racine(sku);
  if(ra && WELIDX.rac[ra]) return WELIDX.rac[ra];
  const nom=code((r.identification&&r.identification.intitule_inpulse));
  if(nom && WELIDX.nom[nom]) return WELIDX.nom[nom];
  const d=chiffres(sku);
  if(d.length>=5 && WELIDX.nb[d]) return WELIDX.nb[d];
  return '';
}
function appliquerWellembal(){
  if(!WEL||!DB) return;
  DB.packagings.forEach(p=>{
    const k=cleWel(p); p._welk=k; p._wel = k?WEL.refs[k]:null;
    const w=p._wel; if(!w) return;
    const c=w.cotes_cm||[null,null,null];
    setPath(p,'dimensions.longueur_cm', c[0]);
    setPath(p,'dimensions.largeur_cm',  c[1]);
    setPath(p,'dimensions.hauteur_cm',  c[2]);
    if(w.matiere)        setPath(p,'matiere.matiere', w.matiere);
    if(w.grammage!=null) setPath(p,'matiere.grammage_g_m2', w.grammage);
    if(w.type)           setPath(p,'matiere.personnalise_tfb', w.type.indexOf('Personnalis')===0);
  });
}

/* ---------- statut ---------- */
/* Quatre sources, de la plus sure a la plus indirecte. Chacune dit
   pourquoi : le statut d'une reference n'est jamais un verdict opaque.
     1. le marquage        — co-brandee, donc ponctuelle
     2. le referentiel Wellembal — archivage, stock, sorties sur six mois
     3. l'historique Inpulse     — commandes depuis janvier
     4. la disponibilite Inpulse — approvisionnable, ou plus du tout   */
function statutSource(r){
  if((r.app&&r.app.marquage)==='Co-branding')
    return {v:'Ponctuelle', d:'co-brandée : TFB et une autre marque'};
  const w=r._wel;
  if(w){
    if(w.archivee) return {v:'Inactive', d:'chez Wellembal : '+w.archivee.toLowerCase()};
    if((w.stock||0)===0 && (w.conso6||0)===0)
      return {v:'Inactive', d:'chez Wellembal : ni stock ni sortie sur six mois'};
    return {v:'Active', d:'chez Wellembal : '+fmt(w.stock)+' colis en stock, '
            +fmt(w.conso6)+' sortis sur six mois'};
  }
  if(r.inpulse && r.inpulse.actif===false)
    return {v:'Inactive', d:'désactivée dans Inpulse'};
  const o = (typeof ORD!=='undefined' && ORD) ? ordFor(r) : null;
  if(o && o.vide) return {v:'Inactive', d:'aucune commande depuis janvier 2026'};
  const dsp=String((r.inpulse&&r.inpulse.dispo)||'');
  const m=/^(\d+)\s*\/\s*(\d+)/.exec(dsp);
  if(m && +m[1]===0)
    return {v:'Inactive', d:'approvisionnable dans aucune boutique ('+dsp+')'};
  if(o && !o.vide)
    return {v:'Active', d:o.tot.n+' commande'+(o.tot.n>1?'s':'')+' depuis janvier 2026'};
  if(m && +m[1]>0)
    return {v:'Active', d:'approvisionnable dans '+dsp+' boutiques'};
  return {v:'', d:'ni ligne Wellembal, ni signal Inpulse'};
}
const statutAuto = r => statutSource(r).v;
const statutDe = r => (r.app&&r.app.cycle) || statutAuto(r);
function pilStatut(r){
  const src=statutSource(r), man=(r.app&&r.app.cycle), v=man||src.v;
  if(!v) return '<span class="vd" title="'+esc(src.d)+'">\u2014<\/span>';
  const t = man ? 'fixé à la main (automatique : '+(src.v||'non déterminé')+')' : src.d;
  return '<span class="pil '+(v==='Active'?'p-a':v==='Inactive'?'p-i':'p-p')
    + (man?' man':'')+'" title="'+esc(t)+'">'+esc(v)+'<\/span>';
}

/* ---------- ce qui manque a une fiche ---------- */
/* Neuf informations attendues : trois cotes, matiere, grammage,
   personnalise TFB, et un document de chaque type. */
function detailManques(r){
  const m=[];
  if(num(getPath(r,'dimensions.longueur_cm'))==null) m.push('longueur');
  if(num(getPath(r,'dimensions.largeur_cm'))==null)  m.push('largeur');
  if(num(getPath(r,'dimensions.hauteur_cm'))==null)  m.push('hauteur');
  if(isEmpty(getPath(r,'matiere.matiere')))          m.push('matière');
  if(num(getPath(r,'matiere.grammage_g_m2'))==null)  m.push('grammage');
  if(getPath(r,'matiere.personnalise_tfb')==null)    m.push('personnalisé TFB');
  DOCUMENTS.forEach(x=>{ if(!documentsDe(r,x.k).length) m.push(x.manque); });
  return m;
}
/* Meme liste, cotes regroupees : c'est ce que lit l'en-tete de fiche. */
function manques(r){
  const d=detailManques(r), cotes=['longueur','largeur','hauteur'];
  const reste=d.filter(x=>cotes.indexOf(x)<0);
  return (d.some(x=>cotes.indexOf(x)>=0) ? ['dimensions'] : []).concat(reste);
}
const tarifUnitaire = r => {

};

/* ---------- recherche, filtres, tri ---------- */
/* Une seule recherche, qui balaie l'intitule, le SKU, le fournisseur et la
   matiere. Les fournisseurs tiennent en pastilles tant qu'ils sont peu
   nombreux ; au-dela c'est une liste deroulante. */
let Q='', FOUR='', STAT='', todo=false;
let sortK='ref', sortD=1;

function passe(p){
  if(todo && !detailManques(p).length) return false;
  if(FOUR && p.inpulse.fournisseur!==FOUR) return false;
  if(STAT && statutDe(p)!==STAT) return false;
  if(Q){
    const h=norm(intituleValue(p)+' '+p.nom+' '+(p.identification.sku_fournisseur||'')+' '
      +(p.inpulse.fournisseur||'')+' '+(getPath(p,'matiere.matiere')||''));
    if(h.indexOf(norm(Q))<0) return false;
  }
  return true;
}

function render(){
  if(!DB) return;
  if(PAGE==='stock'){ renderStock(); return; }

function renderHead(){
  document.getElementById('thead').innerHTML=

      +(c.k===sortK?(sortD>0?'asc':'desc'):'')+'">'+c.lb+'<span class="si"><\/span><\/th>').join('')+'<\/tr>'
  ;

/* ---------- stock : commandes recues et inventaires Inpulse ---------- */
let ORD=null, ORDINFO=null, BYSTORE=null, SNAMES={}, BQ_SID={};
let INV=null, INVDATES={}, INVNAMES={}, INV_SID={}, INVINFO=null;
let BQ_ORPHELINS=[];

/* Rapprocher un nom de depot Inpulse d'une de nos boutiques.
   Inpulse ecrit « TFB RESEAU Sevres », « TFB RESEAU  Sevres  », « Sevres »
   selon les exports : on compare sur une clef sans accent, sans ponctuation,
   sans le prefixe TFB RESEAU / TFB LAB / TFB. */
function clefBq(n){
  return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}
function noyauBq(n){
  return clefBq(n).replace(/^TFB\s+(RESEAU|LAB|LABO|BOUTIQUE)\s+/,'')
                  .replace(/^TFB\s+/,'').trim();
}
/* deux entrees par boutique : le nom complet et son noyau */
const BQ_INP = (()=>{ const o={};
  BOUTIQUES.forEach(b=>{
    o[clefBq(b.inpulse)]=b;
    const n=noyauBq(b.inpulse); if(n && !o[n]) o[n]=b;
    const a=noyauBq(b.nom);     if(a && !o[a]) o[a]=b;
  });
  return o; })();
const trouverBq = n => BQ_INP[clefBq(n)] || BQ_INP[noyauBq(n)] || null;
const MONTHS = (()=>{ const out=[]; const now=new Date();
  for(let y=2026,m=1;;m++){ if(m>12){m=1;y++;}
    out.push(y+'-'+String(m).padStart(2,'0'));
    if(y>now.getFullYear()||(y===now.getFullYear()&&m>=now.getMonth()+1)) break;
    if(out.length>60) break; }
  return out; })();
const MOISLB=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const moisCourt = k => { const [y,m]=k.split('-'); return MOISLB[+m-1]+' '+y.slice(2); };
const INVCACHE='infopack.inv';
const DAY=86400000;
const _JE={};
const joursEntre=(a,b)=>{ const k=a+'|'+b; let v=_JE[k];
  if(v===undefined){ v=Math.max(0,Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/DAY)); _JE[k]=v; }
  return v; };
const invManuel = (p,abr) => getPath(p,'stock.inv.'+abr)||{};
const invOf = (p,abr) => {
  const o=invManuel(p,abr);
  if(!isEmpty(o.q)) return {q:num(o.q), d:o.d||'', src:'tfb'};
  return invInpulse(p,abr) || {q:null, d:'', src:''};
};
const stockFour = p => { const o=getPath(p,'stock.fournisseur')||{}; return {q:num(o.q), d:o.d||''}; };
function invCacheEcrire(d){ try{ sessionStorage.setItem(INVCACHE,JSON.stringify({t:Date.now(),d})); }catch(e){} }
async function loadOrders(force){
  try{
    let r = await fetch('/api/orders'+(force?'?reset=1&work=1':'?work=1'),{cache:'no-store'});
    let d = await r.json();
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    let guard=0;
    while(d.progress && !d.progress.done && guard++ < 40){
      setOrdInfo('spin', d.progress.headers.done
        ? ('Historique : '+d.progress.seen+' commandes lues, '+d.progress.queue+' restantes')
        : ('Historique : balayage '+d.progress.headers.skip+' / '+(d.progress.headers.total||'?')));
      if(d.data){ ORD=d.data; BYSTORE=d.byStore||BYSTORE; SNAMES=d.storeNames||SNAMES; indexStores(); render(); }
      r = await fetch('/api/orders?work=1',{cache:'no-store'});
      d = await r.json();
      if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    }
    ORD = d.data || {};
    BYSTORE = d.byStore || {};
    SNAMES = d.storeNames || {};
    indexStores();
    ORDINFO = {maj:d.full_built_at||d.updated_at, seen:(d.progress&&d.progress.seen)||0};
    setOrdInfo('ok', ORDINFO.seen+' commandes dépouillées depuis janvier 2026');
    render();
  }catch(e){
    ORD=null; setOrdInfo('err','Historique indisponible — '+e.message); render();
  }
}
function ordFor(p){
  if(!ORD) return null;
  const a=ORD[p.identification.intitule_inpulse.trim().toUpperCase()];
  const tot={n:0,oq:0,rq:0};
  if(!a) return {vide:true, mois:{}, tot};
  MONTHS.forEach(m=>{ const c=a[m]; if(c){ tot.n+=c.n; tot.oq+=c.oq; tot.rq+=c.rq; } });
  return {vide:tot.n===0, mois:a, tot};
}
function bqAgg(p){
  const key=p.identification.intitule_inpulse.trim().toUpperCase();
  const raw=(BYSTORE&&BYSTORE[key])||null;
  const out={};
  if(!raw) return out;
  Object.keys(raw).forEach(sid=>{
    const b=BQ_SID[sid]; if(!b) return;
    const s=raw[sid];
    const o=out[b.abr]||(out[b.abr]={n:0,oq:0,rq:0,mois:{},last:null});
    o.n+=s.n||0; o.oq+=s.oq||0; o.rq+=s.rq||0;
    Object.keys(s.mois||{}).forEach(m=>{ const c=o.mois[m]||(o.mois[m]={n:0,oq:0,rq:0});
      c.n+=s.mois[m].n||0; c.oq+=s.mois[m].oq||0; c.rq+=s.mois[m].rq||0; });
    if(s.last&&(!o.last||s.last>o.last)) o.last=s.last;
  });
  return out;
}
function indexStores(){
  BQ_SID={}; BQ_ORPHELINS=[];
  Object.keys(SNAMES||{}).forEach(sid=>{
    const b=trouverBq(SNAMES[sid]);
    if(b) BQ_SID[sid]=b; else if(clefBq(SNAMES[sid])) BQ_ORPHELINS.push(SNAMES[sid]);
  });
}
function indexInvStores(){
  INV_SID={};
  Object.keys(INVNAMES||{}).forEach(sid=>{
    const b=trouverBq(INVNAMES[sid]);
    if(b) INV_SID[sid]=b.abr;
    else if(clefBq(INVNAMES[sid]) && BQ_ORPHELINS.indexOf(INVNAMES[sid])<0)
      BQ_ORPHELINS.push(INVNAMES[sid]);
  });
}
async function loadInventories(force){
  try{
    const d=await inventairesFonction(force);
    INV=d.data||{}; INVNAMES=d.storeNames||{}; INVDATES=d.dates||{}; indexInvStores();
    INVINFO={maj:d.full_built_at||d.updated_at, refs:Object.keys(INV).length};
    setInvInfo('ok', Object.keys(INV).length+' r\u00e9f\u00e9rence(s) relev\u00e9e(s) dans les inventaires Inpulse');
    render(); return;
  }catch(e){ /* la function n'est pas la : on lit nous-memes */ }
  try{
    const cache=force?null:invCacheLire();
    const d=cache||await inventairesViaProxy();
    if(!cache) invCacheEcrire(d);
    INV=d.data||{}; INVNAMES=d.storeNames||{}; INVDATES=d.dates||{}; indexInvStores();
    INVINFO={maj:null, refs:Object.keys(INV).length};
    setInvInfo('ok', Object.keys(INV).length+' r\u00e9f\u00e9rence(s) relev\u00e9e(s) \u2014 lecture directe Inpulse');
    render();
  }catch(e){
    INV=null; setInvInfo('err','Inventaires Inpulse indisponibles \u2014 '+e.message); render();
  }
}
async function inventairesFonction(force){
  const r=await fetch('/api/inventories'+(force?'?reset=1&work=1':'?work=1'),{cache:'no-store'});
  const t=await r.text();
  let d; try{ d=JSON.parse(t); }catch(e){ throw new Error('function absente'); }
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  let guard=0;
  while(d.progress && !d.progress.done && guard++<25){
    INV=d.data||INV; INVNAMES=d.storeNames||INVNAMES; INVDATES=d.dates||INVDATES; indexInvStores();
    setInvInfo('spin','Inventaires Inpulse : '+d.progress.reste+' boutique(s) restante(s)');
    render();
    const r2=await fetch('/api/inventories?work=1',{cache:'no-store'});
    d=await r2.json();
    if(!r2.ok) throw new Error(d.error||('HTTP '+r2.status));
  }
  return d;
}
async function inventairesViaProxy(){
  const P=(e,m,b)=>fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({endpoint:e,method:m||'GET',body:b})})
    .then(async r=>{ const d=await r.json().catch(()=>null);
      if(!r.ok) throw new Error((d&&d.error)||('proxy '+r.status)); return d; });

  setInvInfo('spin','Inventaires Inpulse : boutiques\u2026');
  const sd=await P('/public/v2/stores?limit=100');
  const stores=(sd&&(sd.data||sd))||[];
  const names={}; stores.forEach(x=>{ if(x&&x.id) names[x.id]=x.name; });
  const storeIds=Object.keys(names);

  setInvInfo('spin','Inventaires Inpulse : r\u00e9f\u00e9rences\u2026');
  const packIds={};
  for(let p=0;p<30;p++){
    const d=await P('/public/v2/supplier-products?limit=100&skip='+(p*100));
    const arr=(d&&(d.data||d))||[];
    arr.forEach(x=>{ if(x&&x.category==='PACKAGING'&&x.id) packIds[x.id]=String(x.name||'').trim(); });
    if(arr.length<100) break;
  }

  setInvInfo('spin','Inventaires Inpulse : relev\u00e9s\u2026');
  const corps={startDate:STOCK.debut_historique+'T00:00:00.000Z', endDate:new Date().toISOString(), storeIds};
  let tous=[];
  for(let skip=0; skip<5000; skip+=100){
    const d=await P('/public/v2/inventories?skip='+skip+'&limit=100','POST',corps);
    const arr=(d&&d.data)||[]; tous=tous.concat(arr);
    if(arr.length<100) break;
  }
  const vus={}; tous=tous.filter(x=>vus[x.id]?false:(vus[x.id]=1));
  /* stockConvention « start » = l'inventaire de debut de mois, celui qui
     porte le packaging. On garde le dernier de chaque boutique. */
  const dernier={};
  tous.filter(x=>x.stockConvention==='start').forEach(x=>{
    const k=x.storeId;
    if(!dernier[k]||x.inventoryDate>dernier[k].inventoryDate) dernier[k]=x;
  });
  const liste=Object.values(dernier);

  const inv={}, dates={};
  let faits=0;
  async function detail(x){
    let ls=[], skip=0;
    for(let k=0;k<20;k++){
      /* ce point d'entree n'accepte pas de parametre limit : seul skip compte */
      const d=await P('/public/v2/inventories/'+x.id+(skip?'?skip='+skip:''));
      const arr=(d&&d.data)||[]; ls=ls.concat(arr);
      const tot=(d&&d.total)||0; skip+=100;
      if(ls.length>=tot||arr.length<100) break;
    }
    const jour=String(x.inventoryDate||'').slice(0,10);
    ls.forEach(l=>{
      const nom=packIds[l.supplierProductId]; if(!nom) return;
      const cond=l.supplierProductPackaging||{};
      const q=Number(l.quantity); if(!isFinite(q)) return;
      const cle=nom.toUpperCase();
      (inv[cle]||(inv[cle]={}))[x.storeId]={
        q:q*(Number(cond.quantity)||1), cartons:q, cond:cond.name||'', d:jour };
    });
    dates[x.storeId]=jour;
    setInvInfo('spin','Inventaires Inpulse : '+(++faits)+' / '+liste.length+' boutiques');
  }
  /* quatre de front : une vingtaine de boutiques, sans saturer le proxy */
  let i=0;
  await Promise.all(Array.from({length:Math.min(4,liste.length)}, async ()=>{
    while(i<liste.length){ const k=i++; try{ await detail(liste[k]); }catch(e){} }
  }));
  return {data:inv, dates, storeNames:names, via:'proxy'};
}
function invCacheLire(){
  try{ const o=JSON.parse(sessionStorage.getItem(INVCACHE)||'null');
    return (o && Date.now()-o.t < 1800000) ? o.d : null; }catch(e){ return null; }
}
function invInpulse(p,abr){
  if(!INV) return null;
  const e=INV[String(p.identification.intitule_inpulse||'').trim().toUpperCase()];
  if(!e) return null;
  let best=null;
  Object.keys(e).forEach(sid=>{ if(INV_SID[sid]===abr){ const v=e[sid]; if(!best||(v.d||'')>(best.d||'')) best=v; } });
  return best ? {q:num(best.q), d:best.d||'', cartons:best.cartons, cond:best.cond, src:'inpulse'} : null;
}
function unitesRecuesDepuis(ag,p,abr,depuis){
  const a=ag[abr]; if(!a) return 0;
  const pcb=p.logistique.nombre_par_carton||1;
  if(!depuis) return a.rq*pcb;
  const m0=depuis.slice(0,7);
  let s=0; Object.keys(a.mois).forEach(m=>{ if(m>m0) s+=a.mois[m].rq||0; });
  return s*pcb;
}
function stockBq(p,abr,ag){
  ag=ag||bqAgg(p);
  const pcb=p.logistique.nombre_par_carton||1;
  const a=ag[abr];
  const recu=(a?a.rq:0)*pcb;
  const jours=Math.max(1,joursEntre(STOCK.debut_historique,todayISO()));
  const conso=recu/jours;                       // unités/jour, régime permanent
  const inv=invOf(p,abr);
  if(inv.q==null||!inv.d) return {estime:null, recu, conso, inv};
  const dj=joursEntre(inv.d,todayISO());
  return {estime:Math.max(0,Math.round(inv.q+unitesRecuesDepuis(ag,p,abr,inv.d)-conso*dj)),
          recu, conso, inv};
}
function stockRef(p){
  const ag=bqAgg(p);
  const z={}; ZONES_ORDRE.forEach(k=>z[k]={estime:null,conso:0,recu:0,inv:0});
  let total=null, conso=0, recu=0, nInv=0, dernier='';
  BOUTIQUES.forEach(b=>{
    const s=stockBq(p,b.abr,ag);
    const zz=z[b.zone];
    zz.conso+=s.conso; zz.recu+=s.recu; conso+=s.conso; recu+=s.recu;
    if(s.estime!=null){
      zz.estime=(zz.estime||0)+s.estime; total=(total||0)+s.estime; zz.inv++; nInv++;
      if(s.inv.d>dernier) dernier=s.inv.d;
    }
  });
  const four=stockFour(p);
  const couv = (total!=null&&conso>0) ? Math.round(total/conso) : null;
  return {ag, z, total, conso, recu, nInv, dernier, four, couv};
}
/* ---------- extraction tableur ---------- */
/* Un fichier que le tableur ouvre sans rien demander : separateur
   point-virgule, virgule decimale, BOM UTF-8. C'est ce qu'attend Excel
   en francais. On exporte ce qui est affiche, filtres et tri compris. */
const csvVal = v => {
  if(v==null||v==='') return '';
  if(typeof v==='number') return String(v).replace('.',',');
  let t=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) t=dateFR(t);
  return /[";\r\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
};
function telecharger(nom, texte){
  const b=new Blob(['\ufeff'+texte], {type:'text/csv;charset=utf-8;'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=nom; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 0);
}

/* Les colonnes proposees au choix, selon la feuille ouverte. */
function colonnesTableur(){
  if(PAGE!=='stock')
    return COLS_TABLEUR.map(c=>({k:c[0], lb:c[1], gr:c[2], v:c[3]}));
  const cols=SCOLS||colonnesStock();
  return cols.map(c=>({
    k:c.k,
    lb:c.bq ? c.bq.nom : (c.k==='wel' ? 'Chez Wellembal (colis)' : c.lb),
    gr:c.bq ? 'Boutiques' : (c.k==='ref' ? 'Référence'
       : c.k==='wel' ? 'Chez le fournisseur' : 'Totaux et dates'),
    v:c.t
  }));
}

/* Le choix de colonnes se retient d'une fois sur l'autre. */
const CLE_EXP = p => 'infopack.export.'+p;
function choixRetenu(cles){
  try{
    const b=localStorage.getItem(CLE_EXP(PAGE));
    if(b){ const l=JSON.parse(b).filter(k=>cles.indexOf(k)>=0); if(l.length) return l; }
  }catch(e){}
  return cles.slice();
}
function retenirChoix(l){ try{ localStorage.setItem(CLE_EXP(PAGE), JSON.stringify(l)); }catch(e){} }

function exporterTableur(choisies){
  const jour=todayISO();
  const toutes=colonnesTableur();
  const cols=toutes.filter(c=>!choisies||choisies.indexOf(c.k)>=0);
  if(!cols.length) return;

  let nom, source;
  if(PAGE==='stock'){
    nom='stock-'+ZONE.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
         .replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()+'-'+jour+'.csv';
    source=SLIGNES;
  }else{
    nom='packagings-'+jour+'.csv';
    source=ROWS;
  }
  const lignes=[cols.map(c=>csvVal(c.lb)).join(';')].concat(
    source.map(o=>cols.map(c=>{
      let v; try{ v=c.v(o); }catch(e){ v=''; }
      return csvVal(v===false?'':v);
    }).join(';')));
  if(lignes.length<2) return;
  telecharger(nom, lignes.join('\r\n'));
}

/* ---------- choisir les colonnes avant d'extraire ---------- */
function ouvrirExport(){
  const cols=colonnesTableur();
  if(!cols.length) return;
  const cles=cols.map(c=>c.k);
  let choix=new Set(choixRetenu(cles));

  const groupes=[];
  cols.forEach(c=>{
    let g=groupes.find(g=>g.t===c.gr);
    if(!g){ g={t:c.gr, c:[]}; groupes.push(g); }
    g.c.push(c);
  });

  const corps=document.getElementById('x-corps');
  corps.innerHTML = groupes.map(g=>
    '<div class="xg"><div class="xgt"><b>'+esc(g.t)+'<\/b>'
    + '<button class="lien" data-groupe="'+esc(g.t)+'">tout / rien<\/button><\/div>'
    + '<div class="xl">'+g.c.map(c=>
        '<label class="xc"><input type="checkbox" data-col="'+esc(c.k)+'"'
        + (choix.has(c.k)?' checked':'')+'><span>'+esc(c.lb)+'<\/span><\/label>').join('')
    + '<\/div><\/div>').join('');

  const info=document.getElementById('x-info');
  const nb = PAGE==='stock' ? SLIGNES.length : ROWS.length;
  const maj=()=>{
    choix=new Set([...corps.querySelectorAll('input[data-col]:checked')]
      .map(e=>e.dataset.col));
    info.textContent = nb+' ligne'+(nb>1?'s':'')+' · '+choix.size+' colonne'
      +(choix.size>1?'s':'');
    document.getElementById('x-go').disabled = !choix.size;
  };
  corps.querySelectorAll('input[data-col]').forEach(e=>e.onchange=maj);
  corps.querySelectorAll('[data-groupe]').forEach(b=>b.onclick=()=>{
    const g=groupes.find(g=>g.t===b.dataset.groupe);
    const tout=g.c.every(c=>choix.has(c.k));
    g.c.forEach(c=>{
      const e=corps.querySelector('input[data-col="'+c.k+'"]');
      if(e) e.checked=!tout;
    });
    maj();
  });
  maj();

  document.getElementById('x-tout').onclick=()=>{
    const tout=choix.size===cles.length;
    corps.querySelectorAll('input[data-col]').forEach(e=>e.checked=!tout);
    maj();
  };
  document.getElementById('x-go').onclick=()=>{
    const l=[...choix];
    retenirChoix(l);
    exporterTableur(l);
    fermerExport();
  };
  document.getElementById('dlg-x').classList.add('on');
  document.getElementById('ov-x').classList.add('on');
  document.getElementById('dlg-x').setAttribute('aria-hidden','false');
}
function fermerExport(){
  document.getElementById('dlg-x').classList.remove('on');
  document.getElementById('ov-x').classList.remove('on');
  document.getElementById('dlg-x').setAttribute('aria-hidden','true');
}

/* ---------- feuille Stock ---------- */
/* Source : l'inventaire de debut de mois saisi dans Inpulse par chaque
   boutique — celui qui porte stockConvention « start » —, limite aux
   lignes dont le produit fournisseur est de categorie PACKAGING.
   C'est ce releve qui fait foi ; l'estimation ne fait que le vieillir
   des receptions posterieures et de la consommation moyenne.
   Une colonne par boutique : a l'echelle d'une zone le tableau reste
   lisible, et c'est la question posee — combien il reste, et chez qui. */
let PAGE='pack';
let SROWS=[], SLIGNES=[], SCOLS=null;
let ZONE='Paris boutique';          // zone affichee en colonnes
let RELEVEES=true;                  // n'afficher que les references inventoriees
let sSortK='total', sSortD=-1;

function setOrdInfo(s,t){ etatLigne('ord',s,t); }

const bqZone = z => BOUTIQUES.filter(b=>b.zone===z);
/* Une reference est « relevee » des qu'une boutique de la zone l'a comptee. */
function releveeDansZone(p,ag){
  return bqZone(ZONE).some(b=>{ const s=stockBq(p,b.abr,ag); return s.inv.q!=null && s.inv.d; });
}

function colonnesStock(){

    t:o=>{const s=stockBq(o.p,b.abr,o.ag); return s.estime==null?'':String(s.estime);},
    c:o=>{

   {k:'total', lb:'Total zone', num:1,
    n:o=>o.tz==null?-1:o.tz, t:o=>o.tz==null?'':String(o.tz),
    c:o=>'<td class="num mono">'+(o.tz==null?'<span class="vd">—<\/span>':'<strong>'+fmt(o.tz)+'<\/strong>')+'<\/td>'},
   {k:'couv', lb:'Couverture', num:1,

       +'">'+o.s.couv+' j<\/span>')+'<\/td>'},
   {k:'inv', lb:'Dernier inventaire',

function renderStock(){

    const ag=bqAgg(p), s=stockRef(p);
    let tz=null, dz='';
    bqs.forEach(b=>{ const x=stockBq(p,b.abr,ag);
      if(x.estime!=null){ tz=(tz||0)+x.estime; if(x.inv.d>dz) dz=x.inv.d; } });
    return {p, ag, s, tz, dz, relevee:releveeDansZone(p,ag)};
  });
  const nRelevees=lignes.filter(o=>o.relevee).length;
  if(RELEVEES && nRelevees) lignes=lignes.filter(o=>o.relevee);

  const COLS_S=colonnesStock();

    +(o.p.identification.sku_fournisseur||'')+' '+(o.p.inpulse.fournisseur||'')).indexOf(norm(Q))>=0);

    '<tr class="hd">'+COLS_S.map(c=>'<th data-k="'+c.k+'" class="'+(c.num?'num ':'')
      +(c.k===sSortK?(sSortD>0?'asc':'desc'):'')+'"'+(c.titre?' title="'+esc(c.titre)+'"':'')+'>'

  + '<tr class="tot">'+COLS_S.map(c=>{
      if(c.k==='ref') return '<th class="lb">'+lignes.length+' référence'+(lignes.length>1?'s':'')+'<\/th>';
      if(c.bq){ const t=lignes.reduce((x,o)=>{const s=stockBq(o.p,c.bq.abr,o.ag);
                  return x+(s.estime||0);},0);
                return '<th class="num">'+fmt(t)+'<\/th>'; }

    }).join('')+'<\/tr>'
  ;

        +COLS_S.map(c=>c.c(o)).join('')+'<\/tr>').join('')
    : '<tr><td class="vide" colspan="'+COLS_S.length+'">'
      +(nRelevees?'Aucune référence ne correspond.'
        :'Aucun inventaire packaging lu dans Inpulse pour cette zone. '
         +'Le relevé de début de mois de chaque boutique alimente ce tableau.')
      +'<\/td><\/tr>';

  /* combien de boutiques de la zone ont effectivement rendu un inventaire */

    + (BQ_ORPHELINS.length ? ' · '+BQ_ORPHELINS.length+' dépôt(s) Inpulse non rattaché(s)' : '');

  document.querySelectorAll('#thead tr.hd th').forEach(el=>el.onclick=()=>{

    renderStock();
  });
  document.querySelectorAll('#tb [data-id]').forEach(el=>el.onclick=()=>ouvrir(el.dataset.id));
  if(current) majPosition();
}

function setPage(k){
  PAGE=k;
  document.querySelectorAll('.rnav a').forEach(a=>a.classList.toggle('on',a.dataset.page===k));
  document.getElementById('pt').textContent = k==='stock' ? 'Stock par référence' : 'Base packaging';
  document.getElementById('chips').hidden = k!=='stock';

/* ---------- fiche ---------- */
/* Tout ce que le referentiel fournisseur dit de la reference, et que
   ni Inpulse ni nous ne savons : prix au colis, poids, delai, remarques. */
function blocFournisseur(r){
  const w=r._wel; if(!w) return '';
  const nom=(r.inpulse&&r.inpulse.fournisseur)||'WELLEMBAL';
  const uvc=(String(w.conditionnement||'').match(/(\d[\d\s]*)/)||[])[1];
  const parUnite = (w.prix_colis && uvc) ? w.prix_colis/Number(String(uvc).replace(/\s/g,'')) : null;
  const dispo = w.archivee ? '<b>'+esc(w.archivee)+'<\/b>'
    : fmt(w.stock)+' colis en stock'
      + (w.en_cours ? ' · '+fmt(w.en_cours)+' en cours d’achat' : '')
      + (w.conso6!=null ? ' · '+fmt(w.conso6)+' sortis sur 6 mois' : '');

  return '<div class="blc"><div class="blt">Chez '+esc(nom)+'<\/div><div class="gr">'
    + champ('Désignation fournisseur',
        '<div class="fv">'+esc(w.designation||'—')+'<\/div>'
        + '<div class="regle">Réf. <b>'+esc(r._welk||'—')+'<\/b>'
        + (w.famille?' · '+esc(w.famille):'') + (w.type?' · '+esc(w.type):'')+'<\/div>', 1)
    + champ('Conditionnement',
        '<div class="fv">'+esc(w.conditionnement||'—')+'<\/div>'
        + (w.poids_colis_kg!=null
            ? '<div class="regle">'+fmt(w.poids_colis_kg)+' kg le colis<\/div>' : ''))
    + champ('Prix HT par colis',
        '<div class="fv">'+(w.prix_colis==null?'—':eur(w.prix_colis))+'<\/div>'
        + (parUnite ? '<div class="regle">soit '+eur4(parUnite)+' l’unité<\/div>' : ''))
    + champ('Disponibilité',
        '<div class="fv">'+dispo+'<\/div>'
        + '<div class="regle">'
        + (w.delai_reappro ? 'Réappro annoncé à '+fmt(w.delai_reappro)+' jours · ' : '')
        + 'relevé du '+esc(dateFR((WEL&&WEL.edition)||''))+'<\/div>', 1)
    + (w.observations ? champ('Remarque du fournisseur',
        '<div class="fv">'+esc(w.observations)+'<\/div>', 1) : '')
    + '<\/div><\/div>';
}

function champ(lb,html,large){
  return '<div class="f'+(large?' w':'')+'"><span class="fl">'+lb+'<\/span>'+html+'<\/div>';
}
const lecture = (v,u) => isEmpty(v)||v==='—'
  ? '<div class="fv void">—<\/div>'
  : '<div class="fv">'+esc(v)+(u?'<span class="u">'+esc(u)+'<\/span>':'')+'<\/div>';

function saisieTexte(id,path,v,ph){
  return '<input class="ed" type="text" data-id="'+id+'" data-path="'+path+'" value="'+esc(v==null?'':v)
    +'" placeholder="'+esc(ph||'à compléter')+'">';
}
function saisieNombre(id,path,v,u,pas){
  return '<div class="ctl"><input class="ed" type="text" inputmode="decimal" data-dec="1" data-id="'+id
    +'" data-path="'+path+'" value="'+esc(v==null?'':String(v).replace('.',','))+'" placeholder="—">'
    +(u?'<span class="u">'+esc(u)+'<\/span>':'')+'<\/div>';
}
function saisieListe(id,path,v,options){
  const connue=options.indexOf(v)>=0;
  return '<input class="ed" list="l-'+path.replace(/\W/g,'')+'" data-id="'+id+'" data-path="'+path
    +'" value="'+esc(v==null?'':v)+'" placeholder="à compléter">'
    +'<datalist id="l-'+path.replace(/\W/g,'')+'">'
    + options.concat(connue||isEmpty(v)?[]:[v]).map(o=>'<option value="'+esc(o)+'">').join('')+'<\/datalist>';
}
function saisieOuiNon(id,path,v){
  return '<select class="ed" data-id="'+id+'" data-path="'+path+'">'
    +'<option value="">—<\/option>'
    +'<option value="1"'+(v===true?' selected':'')+'>oui<\/option>'
    +'<option value="0"'+(v===false?' selected':'')+'>non<\/option><\/select>';
}

function blocDocuments(r){
  const w=r._wel;
  const chez = (w && w.bat_gabarit && r._welk)
    ? '<div class="dzw"><i class="ti ti-folder"><\/i><span>BAT et gabarit disponibles chez Wellembal, '
      + 'dans le dossier partagé, sous la référence <b>'+esc(r._welk)+'<\/b>.<\/span><\/div>'
    : (w ? '<div class="dzw tm"><i class="ti ti-folder-off"><\/i><span>Référence neutre : Wellembal ne '
         + 'fournit ni BAT ni gabarit.<\/span><\/div>' : '');
  return chez + DOCUMENTS.map(d=>{
    const f=documentsDe(r,d.k);
    const vign = f.length
      ? '<div class="vign">'+f.map(x=>
          '<a class="vg" href="'+esc(x.url)+'" target="_blank" rel="noopener" title="'+esc(x.nom)+'">'
          + (x.vignette ? '<img loading="lazy" src="'+esc(vignetteURL(x))+'" alt="">'
             : estImage(x.url) ? '<img loading="lazy" src="'+esc(x.url)+'" alt="">'
             : '<i class="ti ti-file"><\/i>')
          + '<span class="nm">'+esc(x.nom)+'<\/span><\/a>').join('')+'<\/div>'
      : '<div class="dzv">Aucun document. Dépose-le dans le Drive packaging, '
        + 'il se rattachera tout seul.<\/div>';
    return '<div class="dz"><div class="dzh"><b>'+esc(d.lb)+'<\/b>'
      + '<span class="aide">'+esc(d.aide)+'<\/span>'
      + '<span class="n">'+(f.length||'')+'<\/span><\/div>'
