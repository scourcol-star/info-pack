/* La fiche se parcourt : quand on remplit 143 references, passer a la
   suivante sans repasser par la liste est le geste le plus frequent. */
const visibles = () => PAGE==='stock' ? SROWS : ROWS;
function majPosition(){
  const l=visibles(), i=current?l.findIndex(p=>p.id===current.id):-1;
  const el=document.getElementById('f-pos'); if(!el) return;
  el.textContent = i<0 ? '' : (i+1)+' / '+l.length;
  document.getElementById('f-prev').disabled = i<=0;
  document.getElementById('f-next').disabled = i<0 || i>=l.length-1;
  document.querySelectorAll('#tb tr').forEach(tr=>
    tr.classList.toggle('sel', !!current && tr.dataset.id===current.id));
}
function voisine(pas){
  const l=visibles(); if(!current||!l.length) return;
  const i=l.findIndex(p=>p.id===current.id), j=i+pas;
  if(i<0||j<0||j>=l.length) return;
  ouvrir(l[j].id);
  const tr=document.querySelector('#tb tr[data-id="'+l[j].id+'"]');
  if(tr) tr.scrollIntoView({block:'nearest'});
}

function fermer(){
  current=null;
  document.querySelectorAll('#tb tr.sel').forEach(tr=>tr.classList.remove('sel'));
  document.getElementById('fiche').classList.remove('on');
  document.getElementById('fiche').setAttribute('aria-hidden','true');
  document.getElementById('ov').classList.remove('on');
}
/* la fiche est redessinée à chaque saisie : on ne rouvre que si elle est ouverte */
function refreshHeader(){ if(current) { /* l'en-tête de fiche suit le rendu */ } }

function brancherFiche(){
  const b=document.getElementById('f-b');
  b.querySelectorAll('.ed[data-path]').forEach(el=>{
    const fin=()=>{
      const p=el.dataset.path; let v=el.value;
      if(el.tagName==='SELECT' && p==='logistique.unite_tarif') v=v.replace(/^par\s+/,'');
      if(el.dataset.dec){ v=num(v); }
      else if(p==='matiere.personnalise_tfb'){ v = v===''?null : v==='1'; }
      saveField(el.dataset.id,p,v);
      if(/marquage|intitule|unite_tarif|cycle/.test(p)) ouvrir(el.dataset.id);
    };
    if(el.tagName==='SELECT') el.onchange=fin; else el.onchange=fin;
  });
  b.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{
    const r=DB.packagings.find(p=>p.id===el.dataset.mode);
    const manuel=getPath(r,'identification.intitule_mode')==='manuel';
    saveField(r.id,'identification.intitule_mode', manuel?null:'manuel');
    if(!manuel) saveField(r.id,'identification.intitule_complet', intituleValue(r));
    ouvrir(r.id);
  });
  b.querySelectorAll('[data-lien]').forEach(el=>el.onkeydown=e=>{
    if(e.key!=='Enter') return;
    const u=el.value.trim(); if(!u) return;
    const r=DB.packagings.find(p=>p.id===el.dataset.id), k=el.dataset.lien;
    saveField(r.id,'documents.'+k, liensManuels(r,k).concat([u]));
    el.value=''; ouvrir(r.id);
  });
}


/* ---------- export PDF d'une fiche ---------- */
/* Pas de bibliotheque : on compose une page d'impression et on laisse le
   navigateur faire le PDF. C'est ce qu'il sait faire de mieux, le rendu
   est net a n'importe quelle taille, et le fichier ne grossit pas d'un
   octet. Le bouton ouvre la boite d'impression ; « Enregistrer au format
   PDF » y est la destination par defaut sur tous les navigateurs. */
const lignePDF = (lb,v,large) => isEmpty(v)||v==='—' ? '' :
  '<div class="pl'+(large?' w':'')+'"><span>'+esc(lb)+'<\/span><b>'+esc(v)+'<\/b><\/div>';

function fichePDF(r){
  const w=r._wel, st=statutSource(r), statut=(r.app&&r.app.cycle)||st.v;
  const cote = k => { const v=num(getPath(r,'dimensions.'+k)); return v==null?null:fmt(v); };
  const L=cote('longueur_cm'), l=cote('largeur_cm'), h=cote('hauteur_cm');
  const dims = (L||l||h) ? [L,l,h].map(x=>x==null?'?':x).join(' × ')+' cm' : null;
  const perso = getPath(r,'matiere.personnalise_tfb');
  const logo = (document.querySelector('.brand')||{}).outerHTML || '';

  const docs = DOCUMENTS.map(d=>{
    const f=documentsDe(r,d.k);
    return '<div class="pd"><span>'+esc(d.lb)+'<\/span>'
      + (f.length ? f.map(x=>'<a href="'+esc(x.url)+'">'+esc(x.nom)+'<\/a>').join('<br>')
         : (w && w.bat_gabarit && d.k!=='photos'
            ? '<i>chez Wellembal, dossier partagé, réf. '+esc(r._welk)+'<\/i>'
            : '<i>aucun document<\/i>'))
      + '<\/div>';
  }).join('');

  const images = DOCUMENTS.reduce((a,d)=>a.concat(documentsDe(r,d.k)
      .filter(x=>x.vignette||estImage(x.url))), [])
    .slice(0,4)
    .map(x=>'<img src="'+esc(x.vignette?vignetteURL(x):x.url)+'" alt="">').join('');

  return '<div class="ph-t">'+logo+'<div class="ph-r"><b>Fiche packaging<\/b>'
      + '<span>Éditée le '+esc(dateFR(todayISO()))+'<\/span><\/div><\/div>'
    + '<h1>'+esc(intituleValue(r)||r.nom)+'<\/h1>'
    + '<div class="ph-s">'+esc(r.inpulse.fournisseur||'fournisseur inconnu')
      + (r.identification.sku_fournisseur?' · '+esc(r.identification.sku_fournisseur):'')
      + (statut?' · '+esc(statut):'')+'<\/div>'

    + '<h2>Identification<\/h2><div class="pg">'
    + lignePDF('Intitulé Inpulse', r.identification.intitule_inpulse, 1)
    + lignePDF('SKU fournisseur', r.identification.sku_fournisseur)
    + lignePDF('Fournisseur', r.inpulse.fournisseur)
    + lignePDF('Design', r.app&&r.app.marquage)
    + lignePDF('Statut', statut ? statut+' — '+st.d : '')
    + (r._welk ? lignePDF('Référence Wellembal', r._welk) : '')
    + (w && w.designation ? lignePDF('Désignation fournisseur', w.designation, 1) : '')
    + (w && w.famille ? lignePDF('Famille fournisseur', w.famille) : '')
    + '<\/div>'

    + '<h2>Achat<\/h2><div class="pg">'
    + lignePDF('Conditionnement', conditionnementHA(r), 1)
    + lignePDF('Tarif unitaire', tarifUnitaire(r)==null?'' : eur4(tarifUnitaire(r))+' par '+uniteTarif(r))
    + lignePDF('Prix HT', r.inpulse.prix_ht==null?'':eur(r.inpulse.prix_ht))
    + (w ? lignePDF('Prix HT par colis', w.prix_colis==null?'':eur(w.prix_colis)) : '')
    + (w ? lignePDF('Poids du colis', w.poids_colis_kg==null?'':fmt(w.poids_colis_kg)+' kg') : '')
    + (w && !w.archivee ? lignePDF('Chez le fournisseur',
        fmt(w.stock)+' colis en stock'
        + (w.en_cours?' · '+fmt(w.en_cours)+' en cours d’achat':'')
        + (w.conso6!=null?' · '+fmt(w.conso6)+' sortis sur 6 mois':'')
        + (w.delai_reappro?' · réappro '+fmt(w.delai_reappro)+' jours':''), 1) : '')
    + (w && w.archivee ? lignePDF('Chez le fournisseur', w.archivee, 1) : '')
    + (w && w.observations ? lignePDF('Remarque du fournisseur', w.observations, 1) : '')
    + '<\/div>'

    + '<h2>Fiche technique<\/h2><div class="pg">'
    + lignePDF('Dimensions (longueur × largeur × hauteur)', dims, 1)
    + (w && w.dimensions_texte ? lignePDF('Au référentiel fournisseur', w.dimensions_texte, 1) : '')
    + lignePDF('Matière', getPath(r,'matiere.matiere'), 1)
    + lignePDF('Grammage', getPath(r,'matiere.grammage_g_m2')==null?'' :
               fmt(getPath(r,'matiere.grammage_g_m2'))+' g/m²')
    + lignePDF('Personnalisé TFB', perso==null?'' : (perso?'oui':'non'))
    + lignePDF('Couleurs d’impression', couleursRef(r), 1)
    + lignePDF('Vernis', (v=>v==null?'':(v?'oui':'non'))(vernisDe(r)))
    + '<\/div>'

    + '<h2>Documents<\/h2><div class="pdl">'+docs+'<\/div>'
    + (images ? '<div class="pim">'+images+'<\/div>' : '')

    + '<div class="pf">The French Bastards · Info Pack · données Inpulse'
    + (WEL&&WEL.edition ? ' · référentiel Wellembal du '+esc(dateFR(WEL.edition)) : '')
    + '<\/div>';
}

function exporterPDF(){
  if(!current) return;
  const z=document.getElementById('impr');
  z.innerHTML=fichePDF(current);
  const avant=document.title;
  document.title='Fiche packaging — '+(intituleValue(current)||current.nom);
  window.print();
  setTimeout(()=>{ document.title=avant; }, 400);
}

/* ---------- démarrage ---------- */
async function load(){
  setConn('spin','Chargement du référentiel…','');
  let doc=null;
  try{ const r=await fetch('data/packaging.json',{cache:'no-store'}); if(r.ok) doc=await r.json(); }catch(e){}
  if(!doc && typeof EMBEDDED!=='undefined') doc=EMBEDDED;
  if(!doc){ setConn('err','Référentiel introuvable',''); return; }
  DB=doc;
  await loadOverrides();
  brancher();
  render();
  chargerWellembal();
  syncInpulse();
  chargerDrive();
  chargerPantone();
  loadOrders();
  loadInventories();
}

/* Le logo du rail ouvre une photo plein ecran. Rien ne l'annonce :
   il faut savoir. On ferme au clic, a Echap ou avec la touche retour. */
function brancherSecret(){
  const z=document.getElementById('scr'), l=document.getElementById('rtop');
  if(!z||!l) return;
  const ouvrir = e => { e.preventDefault(); z.classList.add('on'); };
  const fermerZ = () => z.classList.remove('on');
  l.addEventListener('click', ouvrir);
  z.addEventListener('click', fermerZ);
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && z.classList.contains('on')){ e.stopPropagation(); fermerZ(); }
  }, true);
}

function brancher(){
  brancherSecret();
  document.getElementById('btn-sync').onclick=()=>loadOverrides()
    .then(syncInpulse).then(()=>chargerDrive(true)).then(()=>chargerWellembal(true)).then(()=>loadOrders(true)).then(()=>loadInventories(true));
  document.querySelectorAll('.rnav a[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();setPage(a.dataset.page);});
  document.getElementById('f-x').onclick=fermer;
  document.getElementById('f-prev').onclick=()=>voisine(-1);
  document.getElementById('f-next').onclick=()=>voisine(1);
  document.getElementById('q').oninput=e=>{ Q=e.target.value; PAGE==='stock'?renderStock():render(); };
  document.getElementById('exp').onclick=ouvrirExport;
  document.getElementById('x-fermer').onclick=fermerExport;
  document.getElementById('ov-x').onclick=fermerExport;
  document.getElementById('ov').onclick=fermer;
  document.addEventListener('keydown',e=>{
    const champ=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName||'');
    if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){
      e.preventDefault();
      const el=document.getElementById('q'); if(el){ el.focus(); el.select(); }
      return; }
    if(current && !champ && (e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault(); voisine(e.key==='ArrowDown'?1:-1); return; }
    if(e.key==='Escape'){
      if(current){ fermer(); return; }
      if(champ && e.target.id==='q'){ e.target.value=''; Q=''; PAGE==='stock'?renderStock():render(); } }
  });
}

load();
