# TFB — Info Pack
# index.html est publie tel quel : c'est la source, plus une copie.
#
# L'ancienne regle copiait le app<AAAAMMJJHHMM>.html le plus recent sur
# index.html. Un fichier app202609101205.html de l'app « Pilotage achats »
# ayant ete depose ici, la regle publiait cette autre app a la place
# d'Info Pack : la regle est retiree, index.html fait foi.
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
from = "/api/store"
to = "/.netlify/functions/store"
status = 200

[[redirects]]
from = "/api/proxy"
to = "/.netlify/functions/proxy"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
